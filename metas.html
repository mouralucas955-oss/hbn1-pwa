<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campanhas Mensais — HBN1</title>
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="api.js"></script>
<link rel="stylesheet" href="catalogo.css">
<style>
  .campdesk { font-family:'Plus Jakarta Sans', system-ui, sans-serif; background:var(--surface-page); color:var(--text-primary); min-height:100vh; }
  .campdesk * { box-sizing:border-box; }
  .disp { font-family:'Space Grotesk', sans-serif; }
  .mono { font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  .camp-topbar { background:var(--surface-header); color:#fff; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .camp-back { display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); color:#fff; padding:8px 12px; border-radius:10px; font-size:12.5px; font-weight:700; cursor:pointer; transition:background .15s; text-decoration:none; }
  .camp-back:hover { background:rgba(255,255,255,0.16); }
  .camp-topbar-info { font-size:11.5px; color:#94a3b8; margin-top:2px; }

  .camp-body { max-width:1300px; margin:0 auto; padding:20px; display:flex; flex-direction:column; gap:16px; }

  .camp-panel { background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:14px; padding:16px; }
  .camp-panel-title { font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-secondary); margin-bottom:10px; font-weight:700; }

 .camp-filtro-pills { display:flex; flex-wrap:wrap; gap:10px; }
  .camp-filtro-pill {
    font-family:inherit; font-size:13px; font-weight:700; border-radius:999px;
    display:inline-flex; align-items:center; height:40px; padding:3px;
    border:1.5px solid var(--border-default); background:var(--surface-secondary); color:var(--text-secondary);
    cursor:pointer; overflow:hidden; white-space:nowrap;
    transition: border-color .2s, background .2s, box-shadow .25s, transform .15s, padding .3s cubic-bezier(.4,0,.2,1);
  }
  .camp-filtro-pill:hover { border-color:var(--accent); transform:translateY(-1px); box-shadow:0 4px 14px rgba(0,0,0,0.10); }
  .camp-filtro-pill-ativa { background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 4px 14px rgba(0,0,0,0.16); }
  .camp-filtro-pill:hover, .camp-filtro-pill-ativa { padding-right:16px; }
  .camp-pill-avatar { width:32px; height:32px; border-radius:50%; flex-shrink:0; display:block; }
  .camp-pill-label {
    margin-left:0; max-width:0; opacity:0; overflow:hidden; display:inline-block;
    transition:max-width .3s cubic-bezier(.4,0,.2,1), opacity .2s, margin-left .3s cubic-bezier(.4,0,.2,1);
  }
  .camp-filtro-pill:hover .camp-pill-label,
  .camp-filtro-pill-ativa .camp-pill-label { max-width:220px; opacity:1; margin-left:10px; transition-delay:.05s; }

  /* Barras de progresso (meta x realizado) */
  .camp-progress-track { width:100%; max-width:84px; height:6px; border-radius:999px; background:var(--surface-secondary); overflow:hidden; margin:0 auto; }
  .camp-progress-track.dark { background:rgba(255,255,255,0.18); max-width:none; }
  .camp-progress-fill { height:100%; border-radius:999px; width:0%; background:linear-gradient(90deg,#16a34a,#4ade80); transition:width .7s cubic-bezier(.4,0,.2,1); }
  .camp-progress-fill.amber { background:linear-gradient(90deg,#d97706,#fbbf24); }
  .camp-progress-fill.vermelho { background:linear-gradient(90deg,#dc2626,#f87171); }
  .camp-cell-cobertura { display:flex; flex-direction:column; align-items:center; gap:5px; }

  /* Hero da campanha (Total Geral) */
  .camp-hero-meta { position:relative; overflow:hidden; background:var(--surface-header); border-radius:16px; padding:18px 24px; color:#fff; display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap; }
  .camp-hero-meta::before { content:''; position:absolute; inset:0; background:radial-gradient(circle at 12% 15%, rgba(255,255,255,0.10), transparent 55%); pointer-events:none; }
  .camp-hero-left { display:flex; align-items:center; gap:16px; position:relative; }
  .camp-hero-ring svg { display:block; }
  .camp-hero-eyebrow { font-size:10px; text-transform:uppercase; letter-spacing:.08em; opacity:.6; font-weight:700; }
  .camp-hero-title { font-family:'Space Grotesk', sans-serif; font-size:19px; font-weight:700; line-height:1.2; }
  .camp-hero-sub { font-size:11.5px; opacity:.65; margin-top:2px; }
  .camp-hero-stats { display:flex; gap:26px; flex-wrap:wrap; position:relative; }
  .camp-hero-stats .lbl { font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; opacity:.6; margin-bottom:3px; }
  .camp-hero-stats .val { font-size:16px; font-weight:800; }

  /* Tabela de campanhas do vendedor selecionado (sem cabeçalho de equipe acima) */
  .camp-table-scroll.solo { border-top:1px solid var(--border-subtle); border-radius:10px; }

  .camp-empty { text-align:center; padding:56px 20px; color:var(--text-secondary); }
  .camp-empty .disp { font-size:17px; color:var(--text-primary); margin-bottom:6px; }
  .camp-loading { text-align:center; padding:40px 20px; color:var(--text-secondary); font-size:13px; font-weight:600; }

 .camp-table-scroll { overflow-x:auto; border:1px solid var(--border-subtle); border-top:none; border-radius:0 0 10px 10px; margin-bottom:16px; }
  .camp-table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:12.5px; min-width:880px; }
  .camp-table th:nth-child(1), .camp-table td:nth-child(1) { width:21%; }
  .camp-table th:nth-child(n+2), .camp-table td:nth-child(n+2) { width:13.16%; }
  .camp-table thead th {
    background:var(--surface-secondary); color:var(--text-secondary); text-transform:uppercase; letter-spacing:.04em;
    font-size:10px; font-weight:700; text-align:center; padding:8px 12px; border-bottom:1px solid var(--border-subtle); white-space:nowrap;
  }
  .camp-table thead th:first-child { text-align:left; }
  .camp-table tbody td { padding:8px 12px; border-bottom:1px solid var(--border-subtle); vertical-align:middle; text-align:center; }
  .camp-table tbody tr:last-child td { border-bottom:none; }
  .camp-num { text-align:center; }

  .camp-table tbody tr.camp-row-membro td:first-child { padding-left:32px; color:var(--text-secondary); }
  .camp-table tbody tr.camp-row-membro td:first-child span { font-weight:600 !important; }
  .camp-table tbody tr.camp-row-total td { font-weight:800; background:var(--surface-secondary); }
  .camp-table tbody tr.camp-row-total td:first-child::before { content:'∑ '; opacity:.5; }

  /* Um bloco por fornecedor: separa metas sem perder a leitura da tabela. */
  .camp-fornecedor-bloco { margin-bottom:18px; border:1px solid var(--border-subtle); border-radius:12px; overflow:hidden; background:var(--surface-primary); }
  .camp-fornecedor-cabecalho { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 14px; background:var(--surface-secondary); border-bottom:1px solid var(--border-subtle); }
  .camp-fornecedor-nome { display:flex; align-items:center; gap:9px; font-size:12px; font-weight:800; letter-spacing:.035em; }
  .camp-fornecedor-sub { margin-top:2px; font-size:10.5px; color:var(--text-secondary); font-weight:500; letter-spacing:0; }
  .camp-fornecedor-qtd { font-size:10px; color:var(--text-secondary); white-space:nowrap; }
  .camp-fornecedor-bloco.kenvue { border-color:rgba(249,115,22,.32); }
  .camp-fornecedor-bloco.kenvue .camp-fornecedor-cabecalho { background:linear-gradient(90deg,rgba(249,115,22,.12),var(--surface-secondary)); }
  .camp-fornecedor-bloco .camp-table-scroll { border:0; border-radius:0; margin:0; }
  .camp-kpi-foco td { background:rgba(249,115,22,.045); }
  .camp-kpi-foco td:first-child span { color:#c2410c; }
  .camp-kpi-badge { display:inline-flex; margin-left:7px; padding:2px 6px; border-radius:999px; background:rgba(249,115,22,.13); color:#c2410c; font-size:9px; font-weight:800; letter-spacing:.03em; vertical-align:middle; }

  .camp-pct-pill { font-size:11px; font-weight:800; padding:3px 10px; border-radius:999px; display:inline-block; min-width:56px; text-align:center; }
  .camp-pct-verde  { background: var(--success-soft); color: var(--success); border:1px solid var(--success-border); }
  .camp-pct-amber  { background: rgba(245,158,11,0.12); color:#b45309; border:1px solid rgba(245,158,11,0.35); }
  .camp-pct-vermelho { background: rgba(220,38,38,0.10); color:#dc2626; border:1px solid rgba(220,38,38,0.30); }

  .camp-gap-neg { color:#dc2626; font-weight:700; }
  .camp-gap-pos { color:var(--text-muted); }

  /* Resumo executivo consolidado */
  .camp-resumo {
    position:relative; overflow:hidden; background:var(--surface-header);
    border-radius:16px; padding:18px 20px; color:#fff; margin-bottom:16px;
  }
  .camp-resumo::before {
    content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 10% 10%,rgba(255,255,255,.11),transparent 48%);
    pointer-events:none;
  }
  .camp-resumo-grid {
    position:relative; display:grid;
    grid-template-columns:minmax(230px,1.25fr) repeat(5,minmax(105px,.75fr));
    gap:16px; align-items:center;
  }
  .camp-resumo-vendedor { display:flex; align-items:center; gap:14px; }
  .camp-resumo-stat { min-width:0; }
  .camp-resumo-stat .lbl {
    font-size:9px; text-transform:uppercase; letter-spacing:.06em;
    color:#9dadc1; margin-bottom:4px; font-weight:700;
  }
  .camp-resumo-stat .val { font-size:15px; font-weight:800; }
  .camp-status {
    display:inline-flex; width:max-content; align-items:center; gap:5px;
    padding:4px 8px; border-radius:999px; font-size:9px; font-weight:800;
  }
  .camp-status-ok { color:#4ade80; background:rgba(34,197,94,.15); border:1px solid rgba(74,222,128,.32); }
  .camp-status-risco { color:#fbbf24; background:rgba(245,158,11,.15); border:1px solid rgba(251,191,36,.32); }

  .camp-prioridades {
    background:var(--surface-card); border:1px solid var(--border-subtle);
    border-radius:14px; padding:15px 16px; margin-bottom:16px;
  }
  .camp-prioridades-head {
    display:flex; justify-content:space-between; align-items:flex-end;
    gap:12px; margin-bottom:10px;
  }
  .camp-prioridades-list { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; }
  .camp-prioridades-title { font-size:15px; font-weight:800; color:var(--text-primary); }
  .camp-prioridade-card {
    position:relative; border:1px solid var(--border-subtle); background:var(--surface-secondary);
    border-radius:10px; padding:11px 12px 11px 42px;
  }
  .camp-prioridade-rank {
    position:absolute; left:11px; top:11px; color:#dc2626;
    font:800 10px 'IBM Plex Mono',monospace;
  }
  .camp-prioridade-metricas {
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:7px;
    color:var(--text-secondary); font-size:9.5px; margin-top:8px;
  }
  .camp-prioridade-metricas b { color:var(--text-primary); margin-left:3px; }
  .camp-prioridade-ok {
    grid-column:1 / -1; border:1px solid rgba(34,197,94,.24);
    background:rgba(34,197,94,.08); color:#15803d; border-radius:10px;
    padding:12px; font-size:11.5px; font-weight:700;
  }
  .camp-prioridade-foot { color:var(--text-secondary); font-size:10px; margin-top:9px; }
  .camp-prioridade {
    border:1px solid var(--border-subtle); background:var(--surface-secondary);
    border-radius:10px; padding:10px 11px;
  }
  .camp-prioridade-top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .camp-prioridade-nome {
    font-size:10.5px; font-weight:800; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .camp-prioridade-risco {
    flex-shrink:0; color:#dc2626; background:rgba(220,38,38,.10);
    border:1px solid rgba(220,38,38,.24); padding:3px 7px;
    border-radius:999px; font-size:8.5px; font-weight:800;
  }
  .camp-prioridade-meta {
    display:flex; justify-content:space-between; gap:8px;
    color:var(--text-secondary); font-size:9px; margin-top:7px;
  }
  .camp-legenda {
    display:flex; align-items:center; flex-wrap:wrap; gap:9px;
    color:var(--text-secondary); font-size:9px;
  }
  .camp-legenda i { width:7px; height:7px; display:inline-block; border-radius:50%; margin-right:3px; }

  @media (max-width:1050px) {
    .camp-resumo-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .camp-resumo-vendedor { grid-column:1 / -1; }
  }
  @media (max-width:700px) {
    .camp-body { padding:14px; }
    .camp-filtro-pills { flex-wrap:nowrap; overflow-x:auto; padding-bottom:4px; }
    .camp-filtro-pill { padding-right:13px; flex-shrink:0; }
    .camp-pill-label { max-width:220px; opacity:1; margin-left:8px; }
    .camp-resumo-grid { grid-template-columns:1fr 1fr; }
    .camp-resumo-vendedor { grid-column:1 / -1; }
    .camp-prioridades-list { grid-template-columns:1fr; }
    .camp-prioridades-head { align-items:flex-start; flex-direction:column; }
  }
</style>
</head>
<body class="campdesk">

  <div class="camp-topbar">
    <div style="display:flex; align-items:center; gap:12px;">
      <a href="catalogo.html" class="camp-back">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
        <span>Voltar ao Catálogo</span>
      </a>
      <div>
        <div class="disp" style="font-size:17px; font-weight:700; line-height:1.1;">Campanhas Mensais</div>
        <div class="camp-topbar-info" id="campMesAtualLabel"></div>
      </div>
    </div>
  </div>

  <div class="camp-body">

   <div class="camp-panel">
      <div class="camp-panel-title">Selecione o vendedor</div>
      <div id="campVendedorPills" class="camp-filtro-pills">
        <span style="font-size:12.5px; color:var(--text-secondary);">Carregando vendedores...</span>
      </div>
    </div>

    <div id="campConteudo"></div>

  </div>

<script>
  if (!localStorage.getItem('hbn1_usuario')) window.location.href = 'index.html';

  // Bloqueia acesso direto por URL para quem não é Dedicado (nem Admin).
  (function() {
    let tipo = (localStorage.getItem('hbn1_tipo') || 'VENDEDOR_FARMA').toUpperCase();
    if (tipo === 'VENDEDOR') tipo = 'VENDEDOR_FARMA';
    if (tipo !== 'VENDEDOR_DEDICADO' && tipo !== 'ADMIN') {
      window.location.href = 'catalogo.html';
    }
  })();

  (function() {
    const tema = localStorage.getItem('hbn1_tema') || 'light';
    document.documentElement.setAttribute('data-theme', tema);
  })();

  const UF_USUARIO = (localStorage.getItem('hbn1_uf') || 'PI').toUpperCase();

  const MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  document.getElementById('campMesAtualLabel').innerText =
    'Campanha de ' + MESES_PT[new Date().getMonth()] + '/' + new Date().getFullYear();

  function campFormatBRL(n) {
    if (!isFinite(n)) n = 0;
    return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function campCalcPct(meta, realizado) {
    return meta > 0 ? (realizado / meta * 100) : (realizado > 0 ? 999 : 0);
  }

  function campCorPct(pct) {
    if (pct >= 100) return 'verde';
    if (pct >= 70)  return 'amber';
    return 'vermelho';
  }

  function campClassePct(pct) {
    return 'camp-pct-' + campCorPct(pct);
  }

  function campFillClasse(pct) {
    const cor = campCorPct(pct);
    return cor === 'verde' ? '' : cor;
  }

  function campPctPillHtml(meta, realizado) {
    const pct = campCalcPct(meta, realizado);
    const pctExibir = meta > 0 ? pct.toFixed(1) + '%' : '—';
    return `<span class="camp-pct-pill ${campClassePct(pct)}">${pctExibir}</span>`;
  }

  function campBarraHtml(meta, realizado, classeExtra) {
    const pct = campCalcPct(meta, realizado);
    const larguraFinal = Math.max(0, Math.min(pct, 100));
    return `<div class="camp-progress-track ${classeExtra || ''}"><div class="camp-progress-fill ${campFillClasse(pct)}" data-w="${larguraFinal}"></div></div>`;
  }
  
function campProjecaoHtml(meta, projecao) {
    const pct = campCalcPct(meta, projecao);
    const pctExibir = meta > 0 ? pct.toFixed(1) + '%' : '—';
    return `<div class="camp-cell-cobertura">
      <span class="camp-pct-pill ${campClassePct(pct)}">${pctExibir}</span>
      <span class="mono" style="font-size:10px; color:var(--text-secondary);">${campFormatBRL(projecao)}</span>
    </div>`;
  }
  // Prefixos que devem ser agrupados visualmente na tabela (membros + linha TOTAL).
  // Qualquer campanha cujo fornecedor comece com "PREFIXO " é tratada como membro do grupo,
  // e a linha "PREFIXO" ou "PREFIXO TOTAL" é tratada como o total do grupo.
  const CAMP_GRUPOS_AGREGADOS = ['UNILEVER', 'KIMBERLY'];

  function campOrganizarGrupos(campanhas) {
    const usados = new Set();
    const agrupadas = [];

    CAMP_GRUPOS_AGREGADOS.forEach(prefixo => {
      const prefixoUpper = prefixo.toUpperCase();

      // Linha "total" do grupo: fornecedor chamado exatamente "PREFIXO" ou "PREFIXO TOTAL"
      const total = campanhas.find(c => {
        const nome = c.fornecedor.toUpperCase();
        return nome === prefixoUpper || nome === prefixoUpper + ' TOTAL';
      });

      // Membros: qualquer campanha que comece com "PREFIXO " (independente do sufixo:
      // FEMININOS, ADULTOS, INFANTIL, PC, BW, OUTROS, etc.), exceto a própria linha total.
      const membros = campanhas.filter(c => {
        const nome = c.fornecedor.toUpperCase();
        return nome.startsWith(prefixoUpper + ' ') && (!total || nome !== total.fornecedor.toUpperCase());
      });

      if (membros.length === 0 && !total) return; // esse vendedor não tem esse grupo

      membros.forEach(m => { agrupadas.push({ ...m, _membro: true }); usados.add(m.fornecedor); });
      if (total) {
        agrupadas.push({ ...total, _total: true, _labelExibir: prefixo + ' TOTAL' });
        usados.add(total.fornecedor);
      }
    });

    const restante = campanhas.filter(c => !usados.has(c.fornecedor)).sort((a, b) => b.meta - a.meta);
    return [...restante, ...agrupadas];
  }

  // Avatar circular com a letra inicial do fornecedor (mesmo padrão do catálogo)
  function campGrupoFornecedor(campanha) {
    const nome = String(campanha.grupoVisual || campanha.fornecedor || '').toUpperCase();
    if (nome.startsWith('KENVUE')) return 'KENVUE';
    if (nome.startsWith('UNILEVER')) return 'UNILEVER';
    if (nome.startsWith('KIMBERLY')) return 'KIMBERLY';
    return String(campanha.fornecedor || 'OUTROS').toUpperCase();
  }

  function campLinhaHtml(c) {
    const gap = c.meta - c.realizado;
    const mediaNecessaria = gap > 0 ? gap / (window.CAMP_DIAS_RESTANTES || 1) : 0;
    const nomeExibir = c._labelExibir || c.fornecedor;
    const classesLinha = [
      c._membro ? 'camp-row-membro' : '',
      c._total ? 'camp-row-total' : '',
      c.tipoKpi === 'FRANQUIA_FOCO' ? 'camp-kpi-foco' : ''
    ].filter(Boolean).join(' ');
    const badge = c.tipoKpi === 'FRANQUIA_FOCO'
      ? '<span class="camp-kpi-badge">FRANQUIA FOCO · ORAL</span>'
      : '';

    return `
      <tr class="${classesLinha}">
        <td>
          <div style="display:flex; align-items:center; gap:8px;">
            <img src="${campGerarAvatarLetra(nomeExibir)}" class="camp-pill-avatar" style="width:26px; height:26px;" alt="">
            <span style="font-weight:${c._total ? 800 : 700};">${nomeExibir}${badge}</span>
          </div>
        </td>
        <td class="camp-num mono">${campFormatBRL(c.meta)}</td>
        <td class="camp-num mono">${campFormatBRL(c.realizado)}</td>
        <td class="camp-num"><div class="camp-cell-cobertura">${campPctPillHtml(c.meta, c.realizado)}${campBarraHtml(c.meta, c.realizado)}</div></td>
        <td class="camp-num">${campProjecaoHtml(c.meta, c.projecaoFechamento || 0)}</td>
        <td class="camp-num mono ${gap > 0 ? 'camp-gap-neg' : 'camp-gap-pos'}">${gap > 0 ? campFormatBRL(gap) : '—'}</td>
        <td class="camp-num mono">${mediaNecessaria > 0 ? campFormatBRL(mediaNecessaria) : '—'}</td>
      </tr>`;
  }

  function campTabelaFornecedorHtml(nomeFornecedor, campanhas) {
    const temFranquiaFoco = campanhas.some(c => c.tipoKpi === 'FRANQUIA_FOCO');
    const subtitulo = temFranquiaFoco
      ? 'Meta geral e KPI Franquia Foco — Categoria Oral'
      : 'Metas e realizado do fornecedor';
    const classeFornecedor = nomeFornecedor === 'KENVUE' ? ' kenvue' : '';

    return `
      <section class="camp-fornecedor-bloco${classeFornecedor}">
        <div class="camp-fornecedor-cabecalho">
          <div class="camp-fornecedor-nome">
            <img src="${campGerarAvatarLetra(nomeFornecedor)}" class="camp-pill-avatar" style="width:25px; height:25px;" alt="">
            <div>${nomeFornecedor}<div class="camp-fornecedor-sub">${subtitulo}</div></div>
          </div>
          <span class="camp-fornecedor-qtd">${campanhas.length} KPI${campanhas.length === 1 ? '' : 's'}</span>
        </div>
        <div class="camp-table-scroll">
          <table class="camp-table">
            <thead>
              <tr>
                <th>Campanha</th><th class="camp-num">Meta</th><th class="camp-num">Realizado</th>
                <th class="camp-num">Cobertura</th><th class="camp-num">Projeção Fechamento</th>
                <th class="camp-num">Gap</th><th class="camp-num">Média Necessária/Dia</th>
              </tr>
            </thead>
            <tbody>${campanhas.map(campLinhaHtml).join('')}</tbody>
          </table>
        </div>
      </section>`;
  }

  const CAMP_AVATAR_CACHE = {};
  function campGerarAvatarLetra(nome) {
    if (CAMP_AVATAR_CACHE[nome]) return CAMP_AVATAR_CACHE[nome];
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    let hash = 0;
    for (let i = 0; i < nome.length; i++) hash = nome.charCodeAt(i) + ((hash << 5) - hash);
    const matiz = Math.abs(hash) % 360;
    const grad = ctx.createLinearGradient(0, 0, 64, 64);
    grad.addColorStop(0, `hsl(${matiz}, 68%, 52%)`);
    grad.addColorStop(1, `hsl(${(matiz + 45) % 360}, 68%, 40%)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(32, 32, 32, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '700 30px "Space Grotesk", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(nome.trim().charAt(0).toUpperCase(), 32, 35);
    const dataUrl = canvas.toDataURL();
    CAMP_AVATAR_CACHE[nome] = dataUrl;
    return dataUrl;
  }

  function campPillHtml(vendedor) {
    return `<button type="button" class="camp-filtro-pill" data-vendedor="${vendedor}" onclick="campSelecionarVendedor('${vendedor.replace(/'/g, "\\'")}')">
      <img class="camp-pill-avatar" src="${campGerarAvatarLetra(vendedor)}" alt="">
      <span class="camp-pill-label">${vendedor}</span>
    </button>`;
  }

  // Anel radial de cobertura (SVG) usado no card de Total Geral
  function campAnelSvg(pct, tamanho) {
    const raio = (tamanho - 10) / 2;
    const circunferencia = 2 * Math.PI * raio;
    const pctClamp = Math.max(0, Math.min(pct, 100));
    const centro = tamanho / 2;
    const cor = pct >= 100 ? '#4ade80' : (pct >= 70 ? '#fbbf24' : '#f87171');
    const texto = pct >= 999 ? '—' : Math.round(pct) + '%';
    return `<div class="camp-hero-ring">
      <svg width="${tamanho}" height="${tamanho}" viewBox="0 0 ${tamanho} ${tamanho}">
        <circle cx="${centro}" cy="${centro}" r="${raio}" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="7"></circle>
        <circle class="camp-anel-progresso" cx="${centro}" cy="${centro}" r="${raio}" fill="none" stroke="${cor}" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="${circunferencia}" stroke-dashoffset="${circunferencia}"
          data-offset-final="${circunferencia * (1 - pctClamp / 100)}"
          transform="rotate(-90 ${centro} ${centro})" style="transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1);"></circle>
        <text x="${centro}" y="${centro}" text-anchor="middle" dominant-baseline="central" fill="#fff"
          font-family="IBM Plex Mono, monospace" font-weight="700" font-size="${Math.round(tamanho * 0.19)}">${texto}</text>
      </svg>
    </div>`;
  }

  // Dispara as animações de preenchimento (barras e anel) após o HTML entrar no DOM
  function campAnimarIndicadores() {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        document.querySelectorAll('.camp-progress-fill[data-w]').forEach(el => {
          el.style.width = el.dataset.w + '%';
        });
        document.querySelectorAll('.camp-anel-progresso[data-offset-final]').forEach(el => {
          el.style.strokeDashoffset = el.dataset.offsetFinal;
        });
      });
    });
  }

 let CAMP_VENDEDOR_ATUAL = null;

  function campCarregarVendedores() {
    chamarApi('vendedoresCampanha', { uf: UF_USUARIO })
      .then(lista => {
        const wrap = document.getElementById('campVendedorPills');
        if (!lista || lista.length === 0) {
          wrap.innerHTML = '<span style="font-size:12.5px; color:var(--text-secondary);">Nenhum vendedor com campanha este mês</span>';
          return;
        }
        wrap.innerHTML = lista.map(campPillHtml).join('');
      })
      .catch(() => {
        document.getElementById('campVendedorPills').innerHTML = '<span style="font-size:12.5px; color:var(--text-secondary);">Erro ao carregar vendedores</span>';
      });
  }

  function campSelecionarVendedor(vendedor) {
    CAMP_VENDEDOR_ATUAL = vendedor;
    document.querySelectorAll('.camp-filtro-pill').forEach(btn => {
      btn.classList.toggle('camp-filtro-pill-ativa', btn.dataset.vendedor === vendedor);
    });
    campCarregarCampanha();
  }

  function campCarregarCampanha() {
    const vendedor = CAMP_VENDEDOR_ATUAL;
    const wrap = document.getElementById('campConteudo');
    if (!vendedor) {
      wrap.innerHTML = '<div class="camp-panel"><div class="camp-empty"><div class="disp">Selecione um vendedor</div><div>Escolha acima de quem você quer ver o desempenho nas campanhas do mês.</div></div></div>';
      return;
    }

    wrap.innerHTML = '<div class="camp-panel"><div class="camp-loading">Calculando desempenho de ' + vendedor + '...</div></div>';

    chamarApi('campanhaPorVendedor', { vendedor })
      .then(resp => {
        if (!resp || resp.erro) {
          wrap.innerHTML = '<div class="camp-panel"><div class="camp-empty"><div class="disp">Não foi possível carregar</div><div>' +
            (resp && resp.mensagem ? resp.mensagem : 'Tente novamente.') + '</div></div></div>';
          return;
        }
        campRenderizar(resp);
      })
      .catch(() => {
        wrap.innerHTML = '<div class="camp-panel"><div class="camp-empty"><div class="disp">Erro de conexão</div><div>Não foi possível buscar os dados. Tente novamente.</div></div></div>';
      });
  }

  function campRenderizar(resp) {
    const wrap = document.getElementById('campConteudo');

    if (!resp.campanhas || resp.campanhas.length === 0) {
      wrap.innerHTML = '<div class="camp-panel"><div class="camp-empty"><div class="disp">Nenhuma campanha ativa</div><div>Não há metas cadastradas para este vendedor neste mês.</div></div></div>';
      return;
    }

    const diasRestantes = resp.diasRestantesMes || 1;
    const gapGeral = resp.totalGeral.meta - resp.totalGeral.realizado;
    const pctGeral = campCalcPct(resp.totalGeral.meta, resp.totalGeral.realizado);
    const campanhasOrdenadas = campOrganizarGrupos(resp.campanhas);
    // Linhas agregadas não contam novamente como campanhas individuais.
    const campanhasValidas = campanhasOrdenadas.filter(c => !c._total);
    const qtdCampanhas = campanhasValidas.length;

    // aproveitamento (quantidade de campanhas batidas, não R$)
    const campanhasBatidas = campanhasValidas.filter(c => c.meta > 0 && c.realizado >= c.meta).length;
    const pctAproveitamento = qtdCampanhas > 0 ? (campanhasBatidas / qtdCampanhas * 100) : 0;
    const faltamCampanhas = qtdCampanhas - campanhasBatidas;
    const projecaoGeral = campanhasValidas.reduce((soma, c) => soma + (Number(c.projecaoFechamento) || 0), 0);
    const campanhasEmRisco = campanhasValidas
      .filter(c => c.meta > 0 && (Number(c.projecaoFechamento) || 0) < c.meta)
      .sort((a, b) =>
        (b.meta - (Number(b.projecaoFechamento) || 0)) -
        (a.meta - (Number(a.projecaoFechamento) || 0))
      );
    const projecaoOk = projecaoGeral >= resp.totalGeral.meta;
    const mediaGeralNecessaria = gapGeral > 0 ? gapGeral / diasRestantes : 0;
    const resumoHtml = `
      <section class="camp-resumo">
        <div class="camp-resumo-grid">
          <div class="camp-resumo-vendedor">
            ${campAnelSvg(pctGeral, 84)}
            <div>
              <div class="camp-hero-eyebrow">Vendedor</div>
              <div class="camp-hero-title">${resp.vendedor}</div>
              <div class="camp-hero-sub">${resp.equipe ? resp.equipe + ' · ' : ''}${qtdCampanhas} campanha${qtdCampanhas === 1 ? '' : 's'} ativa${qtdCampanhas === 1 ? '' : 's'}</div>
            </div>
          </div>
          <div class="camp-resumo-stat"><div class="lbl">Meta total</div><div class="val mono">${campFormatBRL(resp.totalGeral.meta)}</div></div>
          <div class="camp-resumo-stat"><div class="lbl">Realizado</div><div class="val mono">${campFormatBRL(resp.totalGeral.realizado)}</div></div>
          <div class="camp-resumo-stat"><div class="lbl">Gap atual</div><div class="val mono">${campFormatBRL(Math.max(0, gapGeral))}</div></div>
          <div class="camp-resumo-stat">
            <div class="lbl">Projeção de fechamento</div>
            <div class="val mono">${campFormatBRL(projecaoGeral)}</div>
            <span class="camp-status ${projecaoOk ? 'camp-status-ok' : 'camp-status-risco'}">${projecaoOk ? 'Dentro da meta' : 'Abaixo da meta'}</span>
          </div>
          <div class="camp-resumo-stat"><div class="lbl">Campanhas batidas</div><div class="val mono">${campanhasBatidas} de ${qtdCampanhas} · ${pctAproveitamento.toFixed(0)}%</div></div>
          <div class="camp-resumo-stat"><div class="lbl">Necessário por dia</div><div class="val mono">${mediaGeralNecessaria > 0 ? campFormatBRL(mediaGeralNecessaria) : 'Meta atingida'}</div></div>
        </div>
      </section>`;

    const prioridadesHtml = `
      <section class="camp-prioridades">
        <div class="camp-prioridades-head">
          <div>
            <div class="camp-hero-eyebrow">Prioridade sugerida</div>
            <div class="camp-prioridades-title">${campanhasEmRisco.length ? 'Top 3 campanhas em risco' : 'Todas as projeções estão dentro da meta'}</div>
          </div>
          <div class="camp-legenda">
            <span><i style="background:#4ade80"></i> ≥ 100%</span>
            <span><i style="background:#fbbf24"></i> 70–99%</span>
            <span><i style="background:#f87171"></i> &lt; 70%</span>
          </div>
        </div>
        <div class="camp-prioridades-list">
          ${campanhasEmRisco.length
            ? campanhasEmRisco.slice(0, 3).map((c, indice) => {
                const gapProjetado = c.meta - (Number(c.projecaoFechamento) || 0);
                const gapAtual = Math.max(0, c.meta - c.realizado);
                return `<article class="camp-prioridade-card">
                  <span class="camp-prioridade-rank">#${indice + 1}</span>
                  <div class="camp-prioridade-nome">${c._labelExibir || c.fornecedor}</div>
                  <div class="camp-prioridade-metricas">
                    <span>Gap projetado <b class="mono">${campFormatBRL(gapProjetado)}</b></span>
                    <span>Necessário/dia <b class="mono">${campFormatBRL(gapAtual / diasRestantes)}</b></span>
                  </div>
                </article>`;
              }).join('')
            : '<div class="camp-prioridade-ok">Excelente: nenhuma campanha apresenta risco na projeção de fechamento.</div>'}
        </div>
        ${faltamCampanhas > 0 ? `<div class="camp-prioridade-foot">Faltam ${faltamCampanhas} campanha${faltamCampanhas === 1 ? '' : 's'} para 100% de aproveitamento.</div>` : ''}
      </section>`;

    // O KPI Oral é exibido junto da Kenvue, enquanto cada fornecedor
    // recebe seu próprio bloco visual.
    window.CAMP_DIAS_RESTANTES = diasRestantes;
    const gruposPorFornecedor = {};
    const ordemFornecedores = [];
    campanhasOrdenadas.forEach(campanha => {
      const grupo = campGrupoFornecedor(campanha);
      if (!gruposPorFornecedor[grupo]) {
        gruposPorFornecedor[grupo] = [];
        ordemFornecedores.push(grupo);
      }
      gruposPorFornecedor[grupo].push(campanha);
    });
    // Fornecedores com o maior gap projetado aparecem primeiro.
    ordemFornecedores.sort((grupoA, grupoB) => {
      const risco = grupo => Math.max(0, ...gruposPorFornecedor[grupo]
        .filter(c => !c._total)
        .map(c => Math.max(0, c.meta - (Number(c.projecaoFechamento) || 0))));
      return risco(grupoB) - risco(grupoA);
    });
    const tabelasPorFornecedor = ordemFornecedores
      .map(grupo => campTabelaFornecedorHtml(grupo, gruposPorFornecedor[grupo]))
      .join('');

    wrap.innerHTML = resumoHtml + prioridadesHtml + tabelasPorFornecedor;
    campAnimarIndicadores();
  }

 document.addEventListener('DOMContentLoaded', () => {
    chamarApi('vendedoresCampanha', { uf: UF_USUARIO })
      .then(lista => {
        const wrap = document.getElementById('campVendedorPills');
        if (!lista || lista.length === 0) {
          wrap.innerHTML = '<span style="font-size:12.5px; color:var(--text-secondary);">Nenhum vendedor com campanha este mês</span>';
          return;
        }
        wrap.innerHTML = lista.map(campPillHtml).join('');
        campSelecionarVendedor(lista[0]);
      })
      .catch(() => {
        document.getElementById('campVendedorPills').innerHTML = '<span style="font-size:12.5px; color:var(--text-secondary);">Erro ao carregar vendedores</span>';
      });
  });
</script>
</body>
</html>
