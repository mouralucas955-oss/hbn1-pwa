<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desempenho de Vendedores — HBN1</title>
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="api.js"></script>

<style>
  :root { --accent: #3b82f6; }
  .campdesk { font-family:'Plus Jakarta Sans', system-ui, sans-serif; background:var(--surface-page); color:var(--text-primary); min-height:100vh; }
  .disp { font-family:'Space Grotesk', sans-serif; }
  .mono { font-family:'IBM Plex Mono', monospace; }

  .camp-topbar { background:var(--surface-header); color:#fff; padding:16px 24px; }
  .camp-panel { background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:16px; padding:24px; }
  
  .pill { font-weight:700; border-radius:9999px; padding:10px 20px; border:2px solid var(--border-default); background:var(--surface-secondary); cursor:pointer; transition:all .2s; }
  .pill-ativa { background:var(--accent); color:#fff; border-color:var(--accent); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.3); }
</style>
</head>
<body class="campdesk">

  <div class="camp-topbar">
    <div class="flex items-center gap-4">
      <a href="catalogo.html" class="flex items-center gap-2 bg-white/10 hover:bg-white/20 px-5 py-2.5 rounded-2xl font-semibold text-sm transition-colors">
        ← Voltar ao Catálogo
      </a>
      <div>
        <div class="disp text-2xl font-bold">Desempenho de Vendedores</div>
        <div class="text-sm text-blue-300" id="campMesAtualLabel"></div>
      </div>
    </div>
  </div>

  <div class="max-w-7xl mx-auto p-6 space-y-8">

    <!-- FILTRO POR VENDEDOR -->
    <div class="camp-panel">
      <p class="text-xs uppercase tracking-widest text-gray-500 mb-3">Selecione o Vendedor</p>
      <div id="vendedoresPills" class="flex flex-wrap gap-3"></div>
    </div>

    <div class="camp-panel">
      <input id="searchInput" type="text" placeholder="Buscar campanha ou fornecedor..." 
        class="w-full px-6 py-4 bg-[var(--surface-secondary)] border border-[var(--border-subtle)] rounded-3xl focus:outline-none focus:border-blue-500"
        onkeyup="filtrarCampanhas()">
    </div>

    <div id="conteudoVendedor"></div>
  </div>

<script>
// Configurações
if (!localStorage.getItem('hbn1_usuario')) window.location.href = 'index.html';

const UF_USUARIO = (localStorage.getItem('hbn1_uf') || 'PI').toUpperCase();
const MESES_PT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

document.getElementById('campMesAtualLabel').innerText = 
  `Campanha de ${MESES_PT[new Date().getMonth()]} / ${new Date().getFullYear()}`;

let VENDEDOR_ATUAL = null;
let currentCharts = [];

// ==================== FUNÇÕES ====================
function campFormatBRL(n) {
  return (isFinite(n) ? n : 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function destroyCharts() {
  currentCharts.forEach(c => c.destroy());
  currentCharts = [];
}

function carregarVendedores() {
  chamarApi('vendedoresCampanha', { uf: UF_USUARIO }).then(lista => {
    const container = document.getElementById('vendedoresPills');
    if (!lista?.length) return;
    
    container.innerHTML = lista.map(v => `
      <button onclick="selecionarVendedor('${v}')" class="pill text-sm" data-vendedor="${v}">${v}</button>
    `).join('');
    
    selecionarVendedor(lista[0]);
  });
}

function selecionarVendedor(vendedor) {
  VENDEDOR_ATUAL = vendedor;
  document.querySelectorAll('.pill').forEach(btn => btn.classList.toggle('pill-ativa', btn.dataset.vendedor === vendedor));
  carregarDesempenhoVendedor(vendedor);
}

function carregarDesempenhoVendedor(vendedor) {
  const wrap = document.getElementById('conteudoVendedor');
  wrap.innerHTML = `<div class="camp-panel text-center py-20">Carregando desempenho de <strong>${vendedor}</strong>...</div>`;

  chamarApi('desempenhoVendedor', { vendedor, uf: UF_USUARIO })
    .then(resp => renderizarDesempenhoVendedor(resp, vendedor))
    .catch(() => wrap.innerHTML = `<div class="camp-panel text-center py-12 text-red-500">Erro ao carregar dados.</div>`);
}

function renderizarDesempenhoVendedor(resp, vendedor) {
  destroyCharts();
  const wrap = document.getElementById('conteudoVendedor');

  if (!resp?.campanhas?.length) {
    wrap.innerHTML = `<div class="camp-panel text-center py-16">Nenhum dado encontrado para este vendedor.</div>`;
    return;
  }

  let html = `
    <div class="mb-8">
      <h1 class="text-3xl font-bold">${vendedor}</h1>
      <p class="text-gray-500">Desempenho consolidado • Evolução mensal</p>
    </div>

    <!-- Gráfico de Tendência Mensal -->
    <div class="camp-panel mb-10">
      <h3 class="font-semibold mb-6 flex items-center gap-2">
        📈 Tendência Mensal (Cobertura %)
      </h3>
      <canvas id="tendenciaChart" height="110"></canvas>
    </div>

    <!-- Resumo + Gráficos Comparativos -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-10">
      <div class="camp-panel">
        <h3 class="font-semibold mb-6">Resumo Geral</h3>
        <canvas id="resumoChart" height="140"></canvas>
      </div>
      <div class="camp-panel">
        <h3 class="font-semibold mb-6">Por Campanha (Este Mês)</h3>
        <canvas id="campanhasChart" height="160"></canvas>
      </div>
    </div>`;

  // Campanhas deste mês
  resp.campanhas.forEach(camp => {
    const pct = camp.meta > 0 ? (camp.realizado / camp.meta * 100) : 0;
    html += `
      <div class="camp-panel mb-8">
        <div class="flex justify-between mb-6">
          <div class="font-bold text-xl">${camp.fornecedor}</div>
          ${campPctPillHtml(camp.meta, camp.realizado)}
        </div>
        <div class="grid grid-cols-3 gap-6 text-center">
          <div><div class="text-gray-500 text-sm">Meta</div><div class="mono text-2xl">${campFormatBRL(camp.meta)}</div></div>
          <div><div class="text-gray-500 text-sm">Realizado</div><div class="mono text-2xl">${campFormatBRL(camp.realizado)}</div></div>
          <div><div class="text-gray-500 text-sm">Gap</div><div class="mono text-2xl ${camp.gap > 0 ? 'text-red-600' : 'text-emerald-600'}">${camp.gap > 0 ? campFormatBRL(camp.gap) : 'BATIDO'}</div></div>
        </div>
      </div>`;
  });

  wrap.innerHTML = html;

  // ==================== GRÁFICOS ====================
  setTimeout(() => {
    // 1. Tendência Mensal (Linha)
    const tendenciaCtx = document.getElementById('tendenciaChart').getContext('2d');
    currentCharts.push(new Chart(tendenciaCtx, {
      type: 'line',
      data: {
        labels: resp.tendencia ? resp.tendencia.map(t => t.mes) : MESES_PT.slice(0, 6),
        datasets: [{
          label: 'Cobertura %',
          data: resp.tendencia ? resp.tendencia.map(t => t.pct) : [65, 72, 81, 78, 95, 108],
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59, 130, 246, 0.1)',
          tension: 0.4,
          borderWidth: 3,
          pointRadius: 5,
          pointHoverRadius: 7
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, max: 120, ticks: { callback: v => v + '%' } }
        }
      }
    }));

    // 2. Resumo Geral (Donut)
    new Chart(document.getElementById('resumoChart'), {
      type: 'doughnut',
      data: {
        labels: ['Realizado', 'Restante'],
        datasets: [{ 
          data: [resp.realizadoTotal || 0, (resp.metaTotal || 0) - (resp.realizadoTotal || 0)], 
          backgroundColor: ['#10b981', '#e2e8f0'] 
        }]
      },
      options: { cutout: '75%' }
    });

    // 3. Barras por Campanha
    new Chart(document.getElementById('campanhasChart'), {
      type: 'bar',
      data: {
        labels: resp.campanhas.map(c => c.fornecedor.length > 12 ? c.fornecedor.substring(0,12)+'...' : c.fornecedor),
        datasets: [
          { label: 'Meta', data: resp.campanhas.map(c => c.meta), backgroundColor: '#64748b' },
          { label: 'Realizado', data: resp.campanhas.map(c => c.realizado), backgroundColor: '#3b82f6' }
        ]
      },
      options: { indexAxis: 'y', responsive: true }
    });
  }, 150);
}

function campPctPillHtml(meta, realizado) {
  const pct = meta > 0 ? (realizado / meta * 100) : 0;
  const cor = pct >= 100 ? 'emerald' : pct >= 70 ? 'amber' : 'red';
  return `<span class="px-5 py-2 rounded-full text-sm font-bold bg-${cor}-100 text-${cor}-700">${pct.toFixed(1)}%</span>`;
}

function filtrarCampanhas() {
  const termo = document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('.camp-panel').forEach(panel => {
    panel.style.display = panel.textContent.toLowerCase().includes(termo) ? 'block' : 'none';
  });
}

// Inicialização
document.addEventListener('DOMContentLoaded', carregarVendedores);
</script>
</body>
</html>
