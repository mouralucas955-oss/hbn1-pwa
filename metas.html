<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campanhas Mensais — HBN1</title>
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="api.js"></script>
<link rel="stylesheet" href="catalogo.css">

<style>
  :root {
    --accent: #3b82f6;
  }
  .campdesk { 
    font-family:'Plus Jakarta Sans', system-ui, sans-serif; 
    background:var(--surface-page); 
    color:var(--text-primary); 
    min-height:100vh; 
  }
  .disp { font-family:'Space Grotesk', sans-serif; }
  .mono { font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  .camp-topbar { 
    background:var(--surface-header); 
    color:#fff; 
    padding:16px 24px; 
    display:flex; 
    align-items:center; 
    justify-content:space-between; 
  }

  .camp-panel {
    background:var(--surface-card); 
    border:1px solid var(--border-subtle); 
    border-radius:16px; 
    padding:20px;
  }

  .camp-fornecedor-pill {
    font-weight:700; 
    border-radius:9999px; 
    padding:10px 20px;
    border:2px solid var(--border-default); 
    background:var(--surface-secondary); 
    color:var(--text-secondary);
    cursor:pointer; 
    transition:all .2s;
  }
  .camp-fornecedor-pill:hover { 
    border-color:var(--accent); 
    transform: translateY(-2px);
  }
  .camp-fornecedor-pill-ativa { 
    background:var(--accent); 
    color:#fff; 
    border-color:var(--accent); 
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.3);
  }

  .kpi-card {
    background:var(--surface-card);
    border-radius:14px;
    padding:16px;
    border:1px solid var(--border-subtle);
  }

  .progress-container {
    height: 10px;
    background: var(--surface-secondary);
    border-radius: 9999px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .camp-table th {
    background:var(--surface-secondary); 
    font-size:10.5px; 
    font-weight:700; 
    text-transform:uppercase; 
    letter-spacing:.05em;
  }
</style>
</head>
<body class="campdesk">

  <!-- Topbar -->
  <div class="camp-topbar">
    <div class="flex items-center gap-4">
      <a href="catalogo.html" class="flex items-center gap-2 bg-white/10 hover:bg-white/20 px-5 py-2.5 rounded-2xl font-semibold text-sm transition-colors">
        ← Voltar ao Catálogo
      </a>
      <div>
        <div class="disp text-2xl font-bold">Campanhas Mensais</div>
        <div class="text-sm text-blue-300" id="campMesAtualLabel"></div>
      </div>
    </div>
    <div class="text-sm text-right">
      <div class="text-white/70">Visualização de Metas</div>
      <button onclick="exportarRelatorio()" class="mt-2 text-xs bg-white/10 hover:bg-white/20 px-4 py-2 rounded-xl transition-colors">
        📥 Exportar
      </button>
    </div>
  </div>

  <div class="max-w-7xl mx-auto p-6 space-y-8">

    <!-- FILTROS -->
    <div class="camp-panel">
      <div class="flex flex-col lg:flex-row gap-6">
        <div class="flex-1">
          <p class="text-xs uppercase tracking-widest text-gray-500 mb-3">Fornecedor</p>
          <div id="campFornecedorPills" class="flex flex-wrap gap-3"></div>
        </div>

        <div class="w-full lg:w-80">
          <p class="text-xs uppercase tracking-widest text-gray-500 mb-3">Buscar Vendedor</p>
          <input 
            id="searchInput" 
            type="text" 
            placeholder="Nome do vendedor ou equipe..." 
            class="w-full px-5 py-4 bg-[var(--surface-secondary)] border border-[var(--border-subtle)] rounded-3xl focus:outline-none focus:border-blue-500 text-sm"
            onkeyup="filtrarTabelas()">
        </div>

        <div class="w-full lg:w-52">
          <p class="text-xs uppercase tracking-widest text-gray-500 mb-3">Desempenho</p>
          <select id="filterDesempenho" onchange="filtrarTabelas()" 
            class="w-full px-5 py-4 bg-[var(--surface-secondary)] border border-[var(--border-subtle)] rounded-3xl text-sm">
            <option value="">Todos os vendedores</option>
            <option value="verde">✅ Acima da meta</option>
            <option value="amber">⚠️ 70% a 99%</option>
            <option value="vermelho">🔴 Abaixo de 70%</option>
          </select>
        </div>
      </div>
    </div>

    <!-- CONTEÚDO -->
    <div id="campConteudo"></div>
  </div>

<script>
// ==================== CONFIGURAÇÕES INICIAIS ====================
if (!localStorage.getItem('hbn1_usuario')) window.location.href = 'index.html';

const UF_USUARIO = (localStorage.getItem('hbn1_uf') || 'PI').toUpperCase();
const MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

document.getElementById('campMesAtualLabel').innerText = 
  `Campanha de ${MESES_PT[new Date().getMonth()]} / ${new Date().getFullYear()}`;

let CAMP_FORNECEDOR_ATUAL = null;

// ==================== FUNÇÕES DE FORMATAÇÃO ====================
function campFormatBRL(n) {
  return (isFinite(n) ? n : 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function campClassePct(pct) {
  if (pct >= 100) return 'bg-emerald-100 text-emerald-700 border-emerald-200';
  if (pct >= 70) return 'bg-amber-100 text-amber-700 border-amber-200';
  return 'bg-red-100 text-red-700 border-red-200';
}

function campPctPillHtml(meta, realizado) {
  const pct = meta > 0 ? (realizado / meta * 100) : 0;
  return `<span class="px-4 py-1.5 rounded-full text-sm font-bold ${campClassePct(pct)}">${pct.toFixed(1)}%</span>`;
}

// ==================== FILTROS ====================
function filtrarTabelas() {
  const termo = document.getElementById('searchInput').value.toLowerCase().trim();
  const filtroDesempenho = document.getElementById('filterDesempenho').value;

  document.querySelectorAll('.camp-equipe-card').forEach(card => {
    const texto = card.textContent.toLowerCase();
    let mostrar = true;

    if (termo && !texto.includes(termo)) mostrar = false;

    if (filtroDesempenho) {
      const pctText = card.querySelector('.pct-geral')?.textContent || '';
      const pct = parseFloat(pctText);
      if (filtroDesempenho === 'verde' && pct < 100) mostrar = false;
      if (filtroDesempenho === 'amber' && (pct < 70 || pct >= 100)) mostrar = false;
      if (filtroDesempenho === 'vermelho' && pct >= 70) mostrar = false;
    }

    card.style.display = mostrar ? 'block' : 'none';
  });
}

// ==================== CARREGAMENTO ====================
function campCarregarFornecedores() {
  chamarApi('fornecedoresCampanha', { uf: UF_USUARIO })
    .then(lista => {
      const container = document.getElementById('campFornecedorPills');
      if (!lista?.length) {
        container.innerHTML = `<span class="text-gray-400">Nenhum fornecedor com campanha este mês.</span>`;
        return;
      }

      container.innerHTML = lista.map(f => `
        <button onclick="campSelecionarFornecedor('${f}')" 
          class="camp-fornecedor-pill text-sm" data-fornecedor="${f}">
          ${f}
        </button>
      `).join('');

      // Seleciona o primeiro automaticamente
      campSelecionarFornecedor(lista[0]);
    });
}

function campSelecionarFornecedor(fornecedor) {
  CAMP_FORNECEDOR_ATUAL = fornecedor;

  document.querySelectorAll('.camp-fornecedor-pill').forEach(btn => {
    btn.classList.toggle('camp-fornecedor-pill-ativa', btn.dataset.fornecedor === fornecedor);
  });

  campCarregarCampanha();
}

function campCarregarCampanha() {
  const wrap = document.getElementById('campConteudo');
  wrap.innerHTML = `
    <div class="camp-panel text-center py-20">
      <div class="animate-pulse text-blue-500">Calculando campanha de <strong>${CAMP_FORNECEDOR_ATUAL}</strong>...</div>
    </div>`;

  chamarApi('campanhaMetas', { fornecedor: CAMP_FORNECEDOR_ATUAL })
    .then(resp => {
      if (resp?.erro) {
        wrap.innerHTML = `<div class="camp-panel text-center py-12 text-red-500">${resp.mensagem || 'Erro ao carregar dados'}</div>`;
        return;
      }
      campRenderizar(resp);
    })
    .catch(() => {
      wrap.innerHTML = `<div class="camp-panel text-center py-12">Erro de conexão. Tente novamente.</div>`;
    });
}

// ==================== RENDERIZAÇÃO PRINCIPAL ====================
function campRenderizar(resp) {
  const wrap = document.getElementById('campConteudo');
  const gapGeral = resp.totalGeral.meta - resp.totalGeral.realizado;

  let html = `
    <!-- KPI Geral -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-10">
      <div class="kpi-card">
        <div class="text-sm text-gray-500">Fornecedor</div>
        <div class="text-2xl font-bold mt-2">${resp.fornecedor}</div>
      </div>
      <div class="kpi-card">
        <div class="text-sm text-gray-500">Meta Total</div>
        <div class="text-3xl font-bold mono mt-1">${campFormatBRL(resp.totalGeral.meta)}</div>
      </div>
      <div class="kpi-card">
        <div class="text-sm text-gray-500">Realizado</div>
        <div class="text-3xl font-bold mono mt-1">${campFormatBRL(resp.totalGeral.realizado)}</div>
      </div>
      <div class="kpi-card">
        <div class="text-sm text-gray-500">Cobertura Geral</div>
        <div class="mt-3">${campPctPillHtml(resp.totalGeral.meta, resp.totalGeral.realizado)}</div>
        <div class="text-xs text-gray-500 mt-2">${gapGeral > 0 ? 'Faltam ' + campFormatBRL(gapGeral) : 'Meta batida!'}</div>
      </div>
    </div>`;

  resp.equipes.forEach(eq => {
    const pctEquipe = eq.meta > 0 ? (eq.realizado / eq.meta * 100) : 0;
    const gapEquipe = eq.meta - eq.realizado;

    let linhas = eq.vendedores.map(v => {
      const gapV = v.meta - v.realizado;
      const pctV = v.meta > 0 ? (v.realizado / v.meta * 100) : 0;
      return `
        <tr class="hover:bg-gray-50 transition-colors">
          <td class="font-semibold py-4">${v.vendedor}</td>
          <td class="mono text-center">${campFormatBRL(v.meta)}</td>
          <td class="mono text-center">${campFormatBRL(v.realizado)}</td>
          <td class="text-center">${campPctPillHtml(v.meta, v.realizado)}</td>
          <td class="mono text-center ${gapV > 0 ? 'text-red-600' : 'text-emerald-600'}">
            ${gapV > 0 ? campFormatBRL(gapV) : '—'}
          </td>
        </tr>`;
    }).join('');

    html += `
      <div class="camp-equipe-card mb-10">
        <div class="flex justify-between items-center px-8 py-6 border-b">
          <div>
            <div class="font-bold text-xl">${eq.equipe}</div>
            <div class="text-sm text-gray-500">Equipe • ${eq.vendedores.length} vendedores</div>
          </div>
          <div class="text-right">
            <div class="flex items-center gap-4 justify-end">
              <div>
                <span class="text-sm text-gray-500">Cobertura</span><br>
                <span class="pct-geral text-2xl font-bold">${pctEquipe.toFixed(1)}%</span>
              </div>
              ${campPctPillHtml(eq.meta, eq.realizado)}
            </div>
          </div>
        </div>

        <div class="px-8 py-5 bg-gray-50">
          <div class="flex justify-between text-sm mb-2">
            <span>Progresso da Equipe</span>
            <span class="font-mono">${pctEquipe.toFixed(1)}%</span>
          </div>
          <div class="progress-container">
            <div class="progress-bar ${pctEquipe >= 100 ? 'bg-emerald-500' : pctEquipe >= 70 ? 'bg-amber-500' : 'bg-red-500'}" 
                 style="width: ${Math.min(pctEquipe, 100)}%"></div>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full camp-table">
            <thead>
              <tr class="border-b">
                <th class="text-left pl-8 py-4">Vendedor</th>
                <th class="text-center">Meta</th>
                <th class="text-center">Realizado</th>
                <th class="text-center">Cobertura</th>
                <th class="text-center">Gap</th>
              </tr>
            </thead>
            <tbody>${linhas}</tbody>
          </table>
        </div>
      </div>`;
  });

  wrap.innerHTML = html;
}

// ==================== EXPORTAÇÃO (placeholder) ====================
function exportarRelatorio() {
  alert("✅ Relatório exportado com sucesso!\n\n(Na versão final você pode integrar com PDF ou Excel)");
}

// ==================== INICIALIZAÇÃO ====================
document.addEventListener('DOMContentLoaded', campCarregarFornecedores);
</script>
</body>
</html>
