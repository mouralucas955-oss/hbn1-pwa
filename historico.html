<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="api.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histórico de Pedidos — HBN1</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-alt: #fafbfc;
    --border: #e2e5ea;
    --text: #1c2230;
    --text-muted: #6b7280;
    --accent: #2f6f4f;
    --accent-hover: #255a40;
    --accent-soft: #e7f2ec;
    --danger: #b8433a;
    --radius: 8px;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Roboto Mono", Consolas, monospace;
  }

  [data-theme="dark"] {
    --bg: #10141c;
    --surface: #171c26;
    --surface-alt: #1d232f;
    --border: #2a3140;
    --text: #e7eaf0;
    --text-muted: #8b93a5;
    --accent: #4caf7d;
    --accent-hover: #5fc590;
    --accent-soft: #163628;
    --danger: #e0685e;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .topbar h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .topbar .subtitle {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .theme-toggle {
    border: 1px solid var(--border);
    background: var(--surface-alt);
    color: var(--text);
    border-radius: 999px;
    width: 34px;
    height: 34px;
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .theme-toggle:hover { background: var(--accent-soft); }

  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px;
  }

  .filters {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }

  .filters-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
  }

  .field label {
    display: block;
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    margin-bottom: 5px;
  }

  .field input, .field select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface-alt);
    color: var(--text);
    font-size: 13.5px;
    font-family: inherit;
  }
  .field input:focus, .field select:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
    border-color: var(--accent);
  }

  .filters-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  button.primary {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 9px 18px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:hover { background: var(--accent-hover); }

  button.ghost {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 14px;
    font-size: 13.5px;
    cursor: pointer;
  }
  button.ghost:hover { background: var(--surface-alt); color: var(--text); }

  .summary-bar {
    display: flex;
    gap: 20px;
    margin-bottom: 14px;
    font-size: 13px;
    color: var(--text-muted);
    flex-wrap: wrap;
  }
  .summary-bar strong { color: var(--text); font-weight: 600; }

  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }

  thead th {
    text-align: left;
    padding: 10px 14px;
    background: var(--surface-alt);
    color: var(--text-muted);
    font-weight: 600;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface-alt); }

  td { padding: 11px 14px; vertical-align: middle; }

  .cell-data { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
  .cell-valor { font-family: var(--font-mono); font-weight: 600; }
  .cell-cliente { font-weight: 500; }
  .cell-cliente .cnpj { display: block; font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 1px; }

  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    background: var(--accent-soft);
    color: var(--accent);
  }

  .chevron { color: var(--text-muted); text-align: right; }

  .empty-state, .loading-state {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13.5px;
  }
  .empty-state .icon { font-size: 28px; margin-bottom: 8px; display: block; }

  /* Detail drawer */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(10, 12, 18, 0.4);
    display: none;
    z-index: 100;
  }
  .overlay.open { display: block; }

  .drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(420px, 92vw);
    background: var(--surface);
    border-left: 1px solid var(--border);
    transform: translateX(100%);
    transition: transform 0.22s ease;
    z-index: 101;
    display: flex;
    flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }

  .drawer-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .drawer-header h2 { font-size: 15px; margin: 0 0 4px; }
  .drawer-header .meta { font-size: 12px; color: var(--text-muted); }
  .drawer-close {
    background: none; border: none; font-size: 18px; color: var(--text-muted);
    cursor: pointer; line-height: 1;
  }

  .drawer-body { padding: 16px 20px; overflow-y: auto; flex: 1; }

  .item-row {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .item-row:last-child { border-bottom: none; }
  .item-row .item-name { flex: 1; }
  .item-row .item-qty { color: var(--text-muted); margin: 0 10px; font-family: var(--font-mono); font-size: 12px; }
  .item-row .item-total { font-family: var(--font-mono); font-weight: 600; min-width: 78px; text-align: right; }

  .drawer-footer {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13.5px;
  }
  .drawer-footer .total-label { color: var(--text-muted); }
  .drawer-footer .total-value { font-family: var(--font-mono); font-weight: 700; font-size: 16px; }

  @media (max-width: 720px) {
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    td { padding: 3px 0; }
    td::before {
      content: attr(data-label);
      display: inline-block;
      font-size: 10.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      width: 90px;
      font-weight: 600;
    }
  }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>Histórico de Pedidos</h1>
    <div class="subtitle">Consulta de pedidos e negociações confirmadas</div>
  </div>
  <button class="theme-toggle" id="themeToggle" title="Alternar tema">🌙</button>
</div>

<main>
  <section class="filters">
    <div class="filters-grid">
      <div class="field">
        <label for="fVendedor">Vendedor</label>
        <select id="fVendedor"><option value="">Todos</option></select>
      </div>
      <div class="field">
        <label for="fUF">UF</label>
        <select id="fUF"><option value="">Todas</option></select>
      </div>
      <div class="field">
        <label for="fFornecedor">Fornecedor</label>
        <select id="fFornecedor"><option value="">Todos</option></select>
      </div>
      <div class="field">
        <label for="fCliente">Cliente ou CNPJ</label>
        <input type="text" id="fCliente" placeholder="Buscar...">
      </div>
      <div class="field">
        <label for="fDataInicio">De</label>
        <input type="date" id="fDataInicio">
      </div>
      <div class="field">
        <label for="fDataFim">Até</label>
        <input type="date" id="fDataFim">
      </div>
    </div>
    <div class="filters-actions">
      <button class="primary" id="btnFiltrar">Filtrar</button>
      <button class="ghost" id="btnLimpar">Limpar filtros</button>
    </div>
  </section>

  <div class="summary-bar" id="summaryBar" style="display:none;">
    <span><strong id="sumCount">0</strong> pedidos</span>
    <span>Total: <strong id="sumTotal">R$ 0,00</strong></span>
  </div>

  <div class="table-wrap">
    <div id="loadingState" class="loading-state">Carregando histórico...</div>
    <table id="resultTable" style="display:none;">
      <thead>
        <tr>
          <th>Data</th>
          <th>Cliente</th>
          <th>Fornecedor</th>
          <th>Vendedor</th>
          <th>UF</th>
          <th>Valor</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>
    <div id="emptyState" class="empty-state" style="display:none;">
      <span class="icon">📋</span>
      Nenhum pedido encontrado para os filtros selecionados.
    </div>
  </div>
</main>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-header">
    <div>
      <h2 id="drawerCliente">—</h2>
      <div class="meta" id="drawerMeta">—</div>
    </div>
    <button class="drawer-close" id="drawerClose">✕</button>
  </div>
  <div class="drawer-body" id="drawerItems"></div>
  <div class="drawer-footer">
    <span class="total-label">Total do pedido</span>
    <span class="total-value" id="drawerTotal">R$ 0,00</span>
  </div>
</aside>

<script>
  if (!localStorage.getItem('hbn1_usuario')) {
  window.location.href = 'index.html';
}
  // ---------- Tema ----------
  const themeToggle = document.getElementById('themeToggle');
  const savedTheme = 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
  });

  // ---------- Formatação ----------
  const formatMoeda = v => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const formatData = iso => {
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  };
  // ---------- Estado ----------
  let historicoCompleto = [];
  let historicoFiltrado = [];
 // ---------- Carregamento via api.js (chamarApi) ----------
function carregarHistorico(filtros = {}) {
  document.getElementById('loadingState').style.display = 'block';
  document.getElementById('resultTable').style.display = 'none';
  document.getElementById('emptyState').style.display = 'none';

  chamarApi('getHistoricoPedidos', { filtros: filtros })
    .then(res => {
      if (res && res.erro) {
        onErroCarregar(res.mensagem || 'Erro desconhecido.');
        return;
      }
      onHistoricoCarregado(res);
    })
    .catch(err => onErroCarregar(err.message || String(err)));
}

  function onHistoricoCarregado(dados) {
    // Backend retorna campos em camelCase (dataHora, clienteCnpj, clienteNome...)
    historicoCompleto = (dados || []).map(item => ({
      DataHora: item.dataHora,
      Vendedor: item.vendedor,
      UF: item.uf,
      Cliente_CNPJ: item.clienteCnpj,
      Cliente_Nome: item.clienteNome,
      Fornecedor: item.fornecedor,
      Itens: item.itens,
      Valor_Total: item.valorTotal
    }));
    popularFiltrosDinamicos(historicoCompleto);
    renderizar(historicoCompleto);
  }

  function onErroCarregar(mensagem) {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('emptyState').innerHTML =
      '<span class="icon">⚠️</span>Erro ao carregar histórico: ' + mensagem;
  }

  function popularFiltrosDinamicos(dados) {
    const vendedores = [...new Set(dados.map(d => d.Vendedor).filter(Boolean))].sort();
    const ufs = [...new Set(dados.map(d => d.UF).filter(Boolean))].sort();
    const fornecedores = [...new Set(dados.map(d => d.Fornecedor).filter(Boolean))].sort();

    preencherSelect('fVendedor', vendedores);
    preencherSelect('fUF', ufs);
    preencherSelect('fFornecedor', fornecedores);
  }

  function preencherSelect(id, valores) {
    const sel = document.getElementById(id);
    const atual = sel.value;
    sel.innerHTML = '<option value="">' + sel.options[0].textContent + '</option>';
    valores.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      sel.appendChild(opt);
    });
    sel.value = atual;
  }

  // ---------- Filtros locais (após carga inicial) ----------
  function aplicarFiltros() {
    const vendedor = document.getElementById('fVendedor').value;
    const uf = document.getElementById('fUF').value;
    const fornecedor = document.getElementById('fFornecedor').value;
    const busca = document.getElementById('fCliente').value.trim().toLowerCase();
    const dataInicio = document.getElementById('fDataInicio').value;
    const dataFim = document.getElementById('fDataFim').value;

    historicoFiltrado = historicoCompleto.filter(item => {
      if (vendedor && item.Vendedor !== vendedor) return false;
      if (uf && item.UF !== uf) return false;
      if (fornecedor && item.Fornecedor !== fornecedor) return false;
      if (busca) {
        const alvo = (item.Cliente_Nome + ' ' + item.Cliente_CNPJ).toLowerCase();
        if (!alvo.includes(busca)) return false;
      }
      if (dataInicio && new Date(item.DataHora) < new Date(dataInicio)) return false;
      if (dataFim) {
        const fim = new Date(dataFim);
        fim.setHours(23, 59, 59, 999);
        if (new Date(item.DataHora) > fim) return false;
      }
      return true;
    });

    renderizar(historicoFiltrado);
  }

  function limparFiltros() {
    document.getElementById('fVendedor').value = '';
    document.getElementById('fUF').value = '';
    document.getElementById('fFornecedor').value = '';
    document.getElementById('fCliente').value = '';
    document.getElementById('fDataInicio').value = '';
    document.getElementById('fDataFim').value = '';
    renderizar(historicoCompleto);
  }

  // ---------- Render ----------
  function renderizar(lista) {
    document.getElementById('loadingState').style.display = 'none';
    const tbody = document.getElementById('resultBody');
    const table = document.getElementById('resultTable');
    const empty = document.getElementById('emptyState');
    const summary = document.getElementById('summaryBar');

    if (!lista.length) {
      table.style.display = 'none';
      empty.style.display = 'block';
      empty.innerHTML = '<span class="icon">📋</span>Nenhum pedido encontrado para os filtros selecionados.';
      summary.style.display = 'none';
      return;
    }

    empty.style.display = 'none';
    table.style.display = 'table';
    summary.style.display = 'flex';

    const ordenada = [...lista].sort((a, b) => new Date(b.DataHora) - new Date(a.DataHora));
    const totalGeral = ordenada.reduce((acc, i) => acc + (Number(i.Valor_Total) || 0), 0);
    document.getElementById('sumCount').textContent = ordenada.length;
    document.getElementById('sumTotal').textContent = formatMoeda(totalGeral);

    tbody.innerHTML = ordenada.map((item, idx) => `
      <tr data-idx="${idx}">
        <td data-label="Data" class="cell-data">${formatData(item.DataHora)}</td>
        <td data-label="Cliente" class="cell-cliente">${escapeHtml(item.Cliente_Nome || '—')}<span class="cnpj">${escapeHtml(item.Cliente_CNPJ || '')}</span></td>
        <td data-label="Fornecedor"><span class="badge">${escapeHtml(item.Fornecedor || '—')}</span></td>
        <td data-label="Vendedor">${escapeHtml(item.Vendedor || '—')}</td>
        <td data-label="UF">${escapeHtml(item.UF || '—')}</td>
        <td data-label="Valor" class="cell-valor">${formatMoeda(item.Valor_Total)}</td>
        <td class="chevron">›</td>
      </tr>
    `).join('');

    tbody.querySelectorAll('tr').forEach(tr => {
      tr.addEventListener('click', () => abrirDetalhe(ordenada[Number(tr.dataset.idx)]));
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // ---------- Drawer de detalhe ----------
  const overlay = document.getElementById('overlay');
  const drawer = document.getElementById('drawer');

  function abrirDetalhe(item) {
    document.getElementById('drawerCliente').textContent = item.Cliente_Nome || 'Cliente';
    document.getElementById('drawerMeta').textContent =
      `${item.Fornecedor || '—'} · ${item.Vendedor || '—'} · ${formatData(item.DataHora)}`;

    const itens = Array.isArray(item.Itens) ? item.Itens : [];
    const body = document.getElementById('drawerItems');
    if (!itens.length) {
      body.innerHTML = '<div class="empty-state">Sem itens detalhados para este pedido.</div>';
    } else {
      body.innerHTML = itens.map(it => `
        <div class="item-row">
          <span class="item-name">${escapeHtml(it.nome || it.ean || 'Item')}</span>
          <span class="item-qty">x${it.quantidade || 1}</span>
          <span class="item-total">${formatMoeda(it.total ?? (it.precoUnitario * (it.quantidade || 1)))}</span>
        </div>
      `).join('');
    }

    document.getElementById('drawerTotal').textContent = formatMoeda(item.Valor_Total);

    overlay.classList.add('open');
    drawer.classList.add('open');
  }

  function fecharDetalhe() {
    overlay.classList.remove('open');
    drawer.classList.remove('open');
  }

  overlay.addEventListener('click', fecharDetalhe);
  document.getElementById('drawerClose').addEventListener('click', fecharDetalhe);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharDetalhe(); });

  // ---------- Eventos de filtro ----------
  document.getElementById('btnFiltrar').addEventListener('click', aplicarFiltros);
  document.getElementById('btnLimpar').addEventListener('click', limparFiltros);
  ['fCliente'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') aplicarFiltros(); });
  });

  // ---------- Init ----------
  carregarHistorico();
</script>

</body>
</html>
