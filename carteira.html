<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carteira de Clientes — HBN1</title>
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="api.js"></script>
<link rel="stylesheet" href="catalogo.css">
<style>
  /* ===== Reaproveita os tokens de tema do catalogo.css (light/dark) ===== */ 
  .cartdesk {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: var(--surface-page);
    color: var(--text-primary);
    min-height: 100vh;
  }
  .cartdesk * { box-sizing: border-box; }
  .disp { font-family: 'Space Grotesk', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  .cart-topbar {
    background: var(--surface-header);
    color: #fff;
    padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .cart-back {
    display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15); color:#fff; padding:8px 12px; border-radius:10px;
    font-size:12.5px; font-weight:700; cursor:pointer; transition:background .15s; text-decoration:none;
  }
  .cart-back:hover { background: rgba(255,255,255,0.16); }

  .cart-topbar-info { font-size:11.5px; color:#94a3b8; margin-top:2px; }

  .cart-body { max-width:1300px; margin:0 auto; padding:20px; display:flex; flex-direction:column; gap:16px; }

  .cart-panel { background: var(--surface-card); border:1px solid var(--border-subtle); border-radius:14px; padding:16px; }
  .cart-panel-title { font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-secondary); margin-bottom:10px; font-weight:700; }

  .cart-select {
    width:100%; max-width:420px; background:var(--surface-secondary); border:1px solid var(--border-default);
    color:var(--text-primary); border-radius:9px; padding:9px 12px; font-size:13.5px; font-family:inherit; font-weight:600;
  }
  .cart-select:focus { border-color: var(--accent); outline:none; }

  .cart-btn {
    font-family:inherit; font-size:12.5px; font-weight:700; border-radius:9px; padding:8px 14px;
    border:1px solid var(--border-default); background:var(--surface-secondary); color:var(--text-primary);
    cursor:pointer; transition:border-color .15s, background .15s; display:inline-flex; align-items:center; gap:6px;
  }
  .cart-btn:hover { border-color: var(--accent); }
  .cart-btn-gold { background: var(--accent); color:#fff; border-color:var(--accent); }
  .cart-btn-gold:hover { filter:brightness(1.06); }

  .cart-input {
    width:100%; max-width:320px; background:var(--surface-secondary); border:1px solid var(--border-default);
    color:var(--text-primary); border-radius:8px; padding:8px 11px; font-size:13px; font-family:inherit;
  }
  .cart-input:focus { border-color: var(--accent); outline:none; }

  .cart-empty { text-align:center; padding:56px 20px; color:var(--text-secondary); }
  .cart-empty .disp { font-size:17px; color:var(--text-primary); margin-bottom:6px; }

  .cart-filtros-row { display:flex; gap:14px; flex-wrap:wrap; }
  .cart-filtros-row .cart-panel { flex:1; min-width:260px; }

  .cart-dropdown-cliente {
    position:absolute; top:100%; left:16px; right:16px; margin-top:4px;
    background:var(--surface-card); border:1px solid var(--border-default); border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,0.18); max-height:240px; overflow-y:auto; z-index:50;
  }
  .cart-dropdown-cliente-item { padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--border-subtle); }
  .cart-dropdown-cliente-item:last-child { border-bottom:none; }
  .cart-dropdown-cliente-item:hover { background: var(--accent-soft); }
  .cart-dropdown-cliente-item .nome { font-size:12px; font-weight:700; }
  .cart-dropdown-cliente-item .meta { font-size:10px; color:var(--text-secondary); display:flex; justify-content:space-between; gap:10px; margin-top:2px; }

  /* ── Grid de cards por fornecedor (Resumo — nível 1) ───────────────── */
  .cart-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:14px; }

  .cart-card { border:1px solid var(--border-subtle); border-radius:16px; overflow:hidden; background:var(--surface-card); box-shadow: var(--shadow-sm); }
  .cart-card-header { padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .cart-card-header-logo { background:rgba(255,255,255,0.95); border-radius:10px; padding:6px 10px; display:flex; align-items:center; justify-content:center; max-width:140px; min-height:32px; }
  .cart-card-header-logo img { height:18px; max-width:110px; object-fit:contain; }
  .cart-card-header-nome { color:#fff; font-weight:800; font-size:13px; letter-spacing:.02em; }

  .cart-card-body { padding:14px 16px; display:flex; flex-direction:column; gap:9px; }
  .cart-metric-row { display:flex; align-items:center; justify-content:space-between; font-size:12.5px; }
  .cart-metric-label { color:var(--text-secondary); }
  .cart-metric-value { font-weight:800; }

  .cart-progress-wrap { margin-top:2px; }
  .cart-progress-track { position:relative; height:8px; background:var(--surface-secondary); border-radius:6px; overflow:hidden; }
  .cart-progress-fill { height:100%; border-radius:6px; transition: width .3s ease; }
  .cart-progress-label { display:flex; justify-content:space-between; font-size:10.5px; color:var(--text-secondary); margin-top:5px; }

  .cart-card-footer { padding:12px 16px; border-top:1px solid var(--border-subtle); }
  .cart-card-footer .cart-btn { width:100%; justify-content:center; }

  /* ── Nível 2 — tabela de clientes por fornecedor ───────────────────── */
  .cart-detail-header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .cart-detail-title-wrap { display:flex; align-items:center; gap:10px; }
  .cart-detail-logo { background:#fff; border-radius:10px; padding:6px 10px; display:flex; align-items:center; justify-content:center; }
  .cart-detail-logo img { height:20px; max-width:120px; object-fit:contain; }

  .cart-table-scroll { overflow-x:auto; border:1px solid var(--border-subtle); border-radius:12px; }
  .cart-table { width:100%; border-collapse:collapse; font-size:12.5px; min-width:720px; }
  .cart-table thead th {
    position:sticky; top:0; background:var(--surface-secondary); color:var(--text-secondary);
    text-transform:uppercase; letter-spacing:.04em; font-size:10px; font-weight:700; text-align:left;
    padding:9px 12px; border-bottom:1px solid var(--border-subtle); white-space:nowrap;
  }
  .cart-table tbody td { padding:9px 12px; border-bottom:1px solid var(--border-subtle); vertical-align:middle; }
  .cart-table tbody tr:hover { background: var(--accent-soft); }
  .cart-table tbody tr:last-child td { border-bottom:none; }
  .cart-num { text-align:right; }

  .cart-badge { font-size:10px; font-weight:800; padding:3px 9px; border-radius:999px; white-space:nowrap; display:inline-flex; align-items:center; gap:4px; }
  .cart-badge-ok { background: var(--success-soft); color: var(--success); border:1px solid var(--success-border); }
  .cart-badge-nao { background: var(--surface-tertiary); color: var(--text-muted); border:1px solid var(--border-subtle); }

  /* ── Badge de Variação YoY (Fat. Mês Atual vs Fat. Ano Anterior) ─────── */
  .cart-var-badge { font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:999px; white-space:nowrap; display:inline-flex; align-items:center; gap:3px; }
  .cart-var-up     { background: var(--success-soft); color: var(--success); border:1px solid var(--success-border); }
  .cart-var-down   { background: rgba(220,38,38,0.10); color: var(--danger, #dc2626); border:1px solid var(--danger, #dc2626); }
  .cart-var-neutro { background: var(--surface-tertiary); color: var(--text-muted); border:1px solid var(--border-subtle); }

  .cart-loading { text-align:center; padding:40px 20px; color:var(--text-secondary); font-size:13px; font-weight:600; }

  /* ── Pills de UF (filtro da carteira por rede) ─────────────────────── */
  .cart-uf-pills { display:flex; flex-wrap:wrap; gap:8px; }
  .cart-uf-pill {
    font-family:inherit; font-size:12px; font-weight:700; border-radius:999px; padding:6px 14px;
    border:1.5px solid var(--border-default); background:var(--surface-secondary); color:var(--text-secondary);
    cursor:pointer; transition:all .15s; display:inline-flex; align-items:center; gap:5px;
  }
  .cart-uf-pill:hover { border-color: var(--accent); }
  .cart-uf-pill-ativa { background: var(--accent); color:#fff; border-color:var(--accent); }
</style>
</head>
<body class="cartdesk">

  <div class="cart-topbar">
    <div style="display:flex; align-items:center; gap:12px;">
      <a href="catalogo.html" id="cartBotaoVoltar" class="cart-back">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
        <span id="cartBotaoVoltarTexto">Voltar ao Catálogo</span>
      </a>
      <div>
        <div class="disp" style="font-size:17px; font-weight:700; line-height:1.1;">Carteira de Clientes</div>
        <div class="cart-topbar-info">Desempenho por vendedor, fornecedor ou cliente</div>
      </div>
    </div>
    <div id="cartResumoTopo" style="display:none; font-size:12px; color:#cbd5e1; text-align:right;">
      <div><strong id="cartTopoVendedor" style="color:#fff;"></strong></div>
      <div id="cartTopoTotalClientes" class="mono"></div>
    </div>
  </div>

  <div class="cart-body">

    <div class="cart-filtros-row">
      <div class="cart-panel" style="position:relative;">
        <div class="cart-panel-title">Buscar cliente diretamente</div>
        <input id="cartBuscaClienteTopo" class="cart-select" style="max-width:100%;" placeholder="🔍 Nome, CNPJ ou código do cliente..." oninput="cartFiltrarClientesTopo()" autocomplete="off">
        <div id="cartDropdownClientesTopo" class="cart-dropdown-cliente" style="display:none;"></div>
      </div>

      <div class="cart-panel" style="position:relative;">
        <div class="cart-panel-title">Ver por vendedor</div>
        <input id="cartBuscaVendedor" class="cart-select" style="max-width:100%;"
               placeholder="🔍 Digite o nome do vendedor..." oninput="cartFiltrarVendedores()"
               onfocus="cartFiltrarVendedores()" autocomplete="off">
        <div id="cartDropdownVendedores" class="cart-dropdown-cliente" style="display:none;"></div>
      </div>

      <div class="cart-panel" style="position:relative;">
        <div class="cart-panel-title">Ver por rede</div>
        <input id="cartBuscaRede" class="cart-select" style="max-width:100%;"
               placeholder="🔍 Digite o nome da rede..." oninput="cartFiltrarRedes()"
               onfocus="cartFiltrarRedes()" autocomplete="off">
        <div id="cartDropdownRedes" class="cart-dropdown-cliente" style="display:none;"></div>
      </div>
    </div>

    <div id="cartFiltroUfsRede" style="display:none;"></div>

    <div id="cartConteudo"></div>

  </div>

<script>
  if (!localStorage.getItem('hbn1_usuario')) {
    window.location.href = 'index.html';
  }

  // Aplica o mesmo tema salvo pelo catálogo (light/dark)
  (function() {
    const tema = localStorage.getItem('hbn1_tema') || 'light';
    document.documentElement.setAttribute('data-theme', tema);
  })();
  // Ajusta o botão "Voltar" conforme a origem da navegação (?origem=negociacao)
  (function() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('origem') === 'negociacao') {
      const btn = document.getElementById('cartBotaoVoltar');
      const txt = document.getElementById('cartBotaoVoltarTexto');
      if (btn && txt) {
        btn.setAttribute('href', 'negociacao.html');
        txt.innerText = 'Voltar à Central de Investimento';
      }
    }
  })();

  const UF_USUARIO = (localStorage.getItem('hbn1_uf') || 'PI').toUpperCase();

  // Mesma config visual de fornecedores usada no catálogo — cores/logos.
  // getConfigFornecedor faz match parcial, então "UNILEVER PC" / "UNILEVER BW"
  // caem automaticamente na config da UNILEVER.
  const CART_CONFIG_FORNECEDORES = {
    'DANONE'   : { cor1: '#3B82C4', cor2: '#1E5FA0', logo: 'https://upload.wikimedia.org/wikipedia/commons/f/f4/DANONE_LOGO_HORIZONTAL.png' },
    'UNILEVER' : { cor1: '#3D5A8A', cor2: '#253A5E', logo: 'https://upload.wikimedia.org/wikipedia/commons/b/ba/Unilever_logo.png' },
    'KIMBERLY' : { cor1: '#C94040', cor2: '#9B2020', logo: 'https://embalagemmarca.com.br/wp-content/uploads/2025/11/Kimberly-Logo.jpg' },
    'KENVUE'   : { cor1: '#2D8B62', cor2: '#1A5C40', logo: 'https://www.celegence.com/wp-content/uploads/2025/06/Kenvue.webp' },
    'OMRON'    : { cor1: '#C0392B', cor2: '#8E1F14', logo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6c/OMRON_Logo.svg/1280px-OMRON_Logo.svg.png' },
  };
  function cartGetConfigFornecedor(nome) {
    const chave = String(nome || '').toUpperCase().trim();
    if (CART_CONFIG_FORNECEDORES[chave]) return CART_CONFIG_FORNECEDORES[chave];
    for (const k of Object.keys(CART_CONFIG_FORNECEDORES)) {
      if (chave.includes(k) || k.includes(chave)) return CART_CONFIG_FORNECEDORES[k];
    }
    return { cor1: '#475569', cor2: '#1E293B', logo: '' };
  }

  function cartFormatBRL(n) {
    if (!isFinite(n)) n = 0;
    return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  // ── Média Mensal ─────────────────────────────────────────────────────
  // ATENÇÃO: aqui assumimos que "faturadoTri" vindo da API já é a soma
  // dos 3 meses ANTERIORES ao mês atual (ou seja, NÃO inclui o mês corrente).
  // Se a API ainda estiver somando o mês atual dentro desse total, o ajuste
  // precisa ser feito na origem (api.js / backend), não aqui no front.
 function cartMediaMensal(faturadoTri, meses) {
  const divisor = (Number(meses) > 0) ? Number(meses) : 3;
  return (Number(faturadoTri) || 0) / divisor;
}

  // ── Variação YoY: Fat. Mês Atual vs Fat. Ano Anterior ────────────────
  function cartCalcVariacaoYoY(anoAnterior, mesAtual) {
    anoAnterior = Number(anoAnterior) || 0;
    mesAtual = Number(mesAtual) || 0;

    if (anoAnterior <= 0) {
      if (mesAtual > 0) return { label: '▲ Novo', classe: 'cart-var-up' };
      return { label: '—', classe: 'cart-var-neutro' };
    }

    const pct = ((mesAtual - anoAnterior) / anoAnterior) * 100;
    if (pct > 0.05) return { label: '▲ ' + pct.toFixed(1) + '%', classe: 'cart-var-up' };
    if (pct < -0.05) return { label: '▼ ' + Math.abs(pct).toFixed(1) + '%', classe: 'cart-var-down' };
    return { label: '— 0,0%', classe: 'cart-var-neutro' };
  }

  function cartBadgeVariacaoHtml(anoAnterior, mesAtual) {
    const v = cartCalcVariacaoYoY(anoAnterior, mesAtual);
    return `<span class="cart-var-badge ${v.classe}">${v.label}</span>`;
  }

  // ── ESTADO GLOBAL ─────────────────────────────────────────────────────
  let CART_VENDEDOR_ATUAL = null;
  let CART_REDE_ATUAL = null;
  let CART_DADOS          = null; // { vendedor, totalClientesCarteira, fornecedores, clientesPorFornecedor }
  let CART_FORNECEDOR_ATUAL = null; // null = nível 1 (resumo); string = nível 2 (detalhe)

  let CART_CLIENTES        = []; // lista completa p/ a busca direta de cliente
  let CART_CLIENTE_ATUAL   = null; // cliente escolhido na busca direta (independe de vendedor)
  let CART_CLIENTE_RESUMO  = null; // resposta de resumoCliente para CART_CLIENTE_ATUAL

  let CART_LISTA_VENDEDORES = []; // lista completa p/ a busca digitável de vendedor
  let CART_LISTA_REDES      = []; // lista completa p/ a busca digitável de rede

  let CART_REDE_UFS_TODAS  = []; // todas as UFs onde a rede selecionada tem clientes
  let CART_REDE_UFS_ATIVAS = new Set(); // UFs atualmente marcadas (pills) — afetam a busca

  function cartCarregarClientesBusca() {
    chamarApi('clientes', { uf: UF_USUARIO })
      .then(lista => { CART_CLIENTES = lista || []; })
      .catch(() => { CART_CLIENTES = []; });
  }

  function cartFiltrarClientesTopo() {
    const termo = document.getElementById('cartBuscaClienteTopo').value.trim().toLowerCase();
    const dropdown = document.getElementById('cartDropdownClientesTopo');
    if (!termo) { dropdown.style.display = 'none'; dropdown.innerHTML = ''; return; }

    const filtrados = CART_CLIENTES.filter(c =>
      String(c.razao || '').toLowerCase().includes(termo) ||
      String(c.cnpj || '').replace(/\D/g, '').includes(termo) ||
      String(c.id || '').toLowerCase().includes(termo)
    ).slice(0, 12);

    if (filtrados.length === 0) {
      dropdown.innerHTML = '<div class="cart-dropdown-cliente-item" style="cursor:default; color:var(--text-secondary);">Nenhum cliente encontrado</div>';
      dropdown.style.display = 'block';
      return;
    }

    dropdown.innerHTML = filtrados.map(c => `
      <div class="cart-dropdown-cliente-item" onclick="cartSelecionarClienteTopo('${String(c.id).replace(/'/g, "\\'")}')">
        <div class="nome">${(c.razao || '').toUpperCase()}</div>
        <div class="meta"><span>ID: ${c.id}</span><span>${c.cnpj || ''}</span></div>
      </div>`).join('');
    dropdown.style.display = 'block';
  }

  function cartSelecionarClienteTopo(id) {
    const cliente = CART_CLIENTES.find(c => String(c.id) === String(id));
    if (!cliente) return;

    // Modo "cliente direto" é independente do modo "por vendedor"/"por rede" — zera os outros
    // pra não misturar as visões na tela.
    CART_VENDEDOR_ATUAL = null;
    CART_REDE_ATUAL = null;
    CART_DADOS = null;
    CART_FORNECEDOR_ATUAL = null;
    CART_REDE_UFS_TODAS = [];
    CART_REDE_UFS_ATIVAS = new Set();
    document.getElementById('cartBuscaVendedor').value = '';
    document.getElementById('cartBuscaRede').value = '';

    CART_CLIENTE_ATUAL = cliente;
    CART_CLIENTE_RESUMO = null;
    document.getElementById('cartBuscaClienteTopo').value = '';
    document.getElementById('cartDropdownClientesTopo').style.display = 'none';
    document.getElementById('cartDropdownClientesTopo').innerHTML = '';

    document.getElementById('cartResumoTopo').style.display = 'block';
    document.getElementById('cartTopoVendedor').innerText = cliente.razao || cliente.id;
    document.getElementById('cartTopoTotalClientes').innerText = 'CNPJ: ' + (cliente.cnpj || '—');

    document.getElementById('cartConteudo').innerHTML =
      '<div class="cart-panel"><div class="cart-loading">Buscando faturamento de ' + (cliente.razao || cliente.id) + '...</div></div>';

    chamarApi('resumoCliente', { uf: UF_USUARIO, codCliente: cliente.id })
      .then(resp => {
        CART_CLIENTE_RESUMO = resp;
        cartRenderConteudo();
      })
      .catch(() => {
        document.getElementById('cartConteudo').innerHTML =
          '<div class="cart-panel"><div class="cart-empty"><div class="disp">Erro de conexão</div><div>Não foi possível buscar os dados. Tente novamente.</div></div></div>';
      });
  }

  function cartLimparClienteTopo() {
    CART_CLIENTE_ATUAL = null;
    CART_CLIENTE_RESUMO = null;
    document.getElementById('cartResumoTopo').style.display = 'none';
    cartRenderConteudo();
  }

  // Fecha os dropdowns de busca ao clicar fora
  document.addEventListener('click', function(e) {
    const dropdown = document.getElementById('cartDropdownClientesTopo');
    const input = document.getElementById('cartBuscaClienteTopo');
    if (dropdown && input && !dropdown.contains(e.target) && e.target !== input) {
      dropdown.style.display = 'none';
    }

    const dropdownV = document.getElementById('cartDropdownVendedores');
    const inputV = document.getElementById('cartBuscaVendedor');
    if (dropdownV && inputV && !dropdownV.contains(e.target) && e.target !== inputV) {
      dropdownV.style.display = 'none';
    }

    const dropdownR = document.getElementById('cartDropdownRedes');
    const inputR = document.getElementById('cartBuscaRede');
    if (dropdownR && inputR && !dropdownR.contains(e.target) && e.target !== inputR) {
      dropdownR.style.display = 'none';
    }
  });

  // ── CARREGAMENTO DAS LISTAS (vendedores e redes) ─────────────────────
  function cartCarregarVendedores() {
    chamarApi('vendedores', { uf: UF_USUARIO })
      .then(lista => { CART_LISTA_VENDEDORES = lista || []; })
      .catch(() => { CART_LISTA_VENDEDORES = []; });
  }

  function cartCarregarRedes() {
    chamarApi('redes', { uf: UF_USUARIO })
      .then(lista => { CART_LISTA_REDES = lista || []; })
      .catch(() => { CART_LISTA_REDES = []; });
  }

  // ── BUSCA DIGITÁVEL — VENDEDOR ────────────────────────────────────────
  function cartFiltrarVendedores() {
    const termo = document.getElementById('cartBuscaVendedor').value.trim().toLowerCase();
    const dropdown = document.getElementById('cartDropdownVendedores');
    const filtrados = termo
      ? CART_LISTA_VENDEDORES.filter(v => v.toLowerCase().includes(termo))
      : CART_LISTA_VENDEDORES;

    if (filtrados.length === 0) {
      dropdown.innerHTML = '<div class="cart-dropdown-cliente-item" style="cursor:default; color:var(--text-secondary);">Nenhum vendedor encontrado</div>';
    } else {
      dropdown.innerHTML = filtrados.slice(0, 20).map(v => `
        <div class="cart-dropdown-cliente-item" onclick="cartSelecionarVendedorDropdown('${v.replace(/'/g, "\\'")}')">
          <div class="nome">${v}</div>
        </div>`).join('');
    }
    dropdown.style.display = 'block';
  }

  function cartSelecionarVendedorDropdown(nome) {
    document.getElementById('cartBuscaVendedor').value = nome;
    document.getElementById('cartDropdownVendedores').style.display = 'none';
    cartOnSelecionarVendedor(nome);
  }

  function cartOnSelecionarVendedor(nome) {
    CART_FORNECEDOR_ATUAL = null;
    CART_CLIENTE_ATUAL = null;
    CART_CLIENTE_RESUMO = null;
    document.getElementById('cartBuscaClienteTopo').value = '';
    document.getElementById('cartDropdownClientesTopo').style.display = 'none';

    // Zera o filtro de rede (e as pills de UF, que só existem no modo rede) pra não misturar as visões
    CART_REDE_ATUAL = null;
    CART_REDE_UFS_TODAS = [];
    CART_REDE_UFS_ATIVAS = new Set();
    document.getElementById('cartBuscaRede').value = '';

    if (!nome) {
      CART_VENDEDOR_ATUAL = null;
      CART_DADOS = null;
      document.getElementById('cartResumoTopo').style.display = 'none';
      cartRenderConteudo();
      return;
    }

    CART_VENDEDOR_ATUAL = nome;
    document.getElementById('cartConteudo').innerHTML =
      '<div class="cart-panel"><div class="cart-loading">Calculando carteira de ' + nome + '...</div></div>';

    chamarApi('carteiraVendedor', { uf: UF_USUARIO, vendedor: nome })
      .then(resp => {
        if (!resp || resp.erro) {
          document.getElementById('cartConteudo').innerHTML =
            '<div class="cart-panel"><div class="cart-empty"><div class="disp">Não foi possível carregar</div><div>' +
            (resp && resp.mensagem ? resp.mensagem : 'Tente novamente em instantes.') + '</div></div></div>';
          return;
        }
        CART_DADOS = resp;
        document.getElementById('cartResumoTopo').style.display = 'block';
        document.getElementById('cartTopoVendedor').innerText = resp.vendedor;
        document.getElementById('cartTopoTotalClientes').innerText =
          resp.totalClientesCarteira + ' cliente' + (resp.totalClientesCarteira !== 1 ? 's' : '') + ' na carteira';
        cartRenderConteudo();
      })
      .catch(() => {
        document.getElementById('cartConteudo').innerHTML =
          '<div class="cart-panel"><div class="cart-empty"><div class="disp">Erro de conexão</div><div>Não foi possível buscar os dados. Tente novamente.</div></div></div>';
      });
  }

  // ── BUSCA DIGITÁVEL — REDE ────────────────────────────────────────────
  function cartFiltrarRedes() {
    const termo = document.getElementById('cartBuscaRede').value.trim().toLowerCase();
    const dropdown = document.getElementById('cartDropdownRedes');
    const filtrados = termo
      ? CART_LISTA_REDES.filter(r => r.toLowerCase().includes(termo))
      : CART_LISTA_REDES;

    if (filtrados.length === 0) {
      dropdown.innerHTML = '<div class="cart-dropdown-cliente-item" style="cursor:default; color:var(--text-secondary);">Nenhuma rede encontrada</div>';
    } else {
      dropdown.innerHTML = filtrados.slice(0, 20).map(r => `
        <div class="cart-dropdown-cliente-item" onclick="cartSelecionarRedeDropdown('${r.replace(/'/g, "\\'")}')">
          <div class="nome">${r}</div>
        </div>`).join('');
    }
    dropdown.style.display = 'block';
  }

  function cartSelecionarRedeDropdown(nome) {
    document.getElementById('cartBuscaRede').value = nome;
    document.getElementById('cartDropdownRedes').style.display = 'none';
    cartOnSelecionarRede(nome);
  }

  function cartOnSelecionarRede(nome) {
    CART_FORNECEDOR_ATUAL = null;
    CART_CLIENTE_ATUAL = null;
    CART_CLIENTE_RESUMO = null;
    document.getElementById('cartBuscaClienteTopo').value = '';
    document.getElementById('cartDropdownClientesTopo').style.display = 'none';

    // Zera o filtro de vendedor pra não misturar as duas visões
    CART_VENDEDOR_ATUAL = null;
    document.getElementById('cartBuscaVendedor').value = '';

    if (!nome) {
      CART_REDE_ATUAL = null;
      CART_DADOS = null;
      CART_REDE_UFS_TODAS = [];
      CART_REDE_UFS_ATIVAS = new Set();
      document.getElementById('cartResumoTopo').style.display = 'none';
      cartRenderFiltroUfsRede();
      cartRenderConteudo();
      return;
    }

    CART_REDE_ATUAL = nome;
    CART_DADOS = null;
    CART_REDE_UFS_TODAS = [];
    CART_REDE_UFS_ATIVAS = new Set();
    cartRenderFiltroUfsRede();
    document.getElementById('cartConteudo').innerHTML = '<div class="cart-panel"><div class="cart-loading">Buscando UFs da rede ' + nome + '...</div></div>';

    // Primeiro descobre em quais UFs essa rede tem clientes — as pills começam
    // todas marcadas, e é a partir delas que a carteira é buscada (abaixo).
    chamarApi('ufsPorRede', { rede: nome })
      .then(ufs => {
        // Se a rede não trouxer UFs (ou a chamada retornar vazio), a carteira
        // segue sem restringir por UF — mesmo comportamento de antes.
        CART_REDE_UFS_TODAS = ufs || [];
        CART_REDE_UFS_ATIVAS = new Set(CART_REDE_UFS_TODAS);
        cartRenderFiltroUfsRede();
        cartBuscarCarteiraRede();
      })
      .catch(() => {
        CART_REDE_UFS_TODAS = [];
        CART_REDE_UFS_ATIVAS = new Set();
        cartRenderFiltroUfsRede();
        cartBuscarCarteiraRede();
      });
  }

  // Alterna uma UF (pill) ligada/desligada e refaz a busca da carteira da rede
  function cartToggleUfRede(uf) {
    if (CART_REDE_UFS_ATIVAS.has(uf)) {
      CART_REDE_UFS_ATIVAS.delete(uf);
    } else {
      CART_REDE_UFS_ATIVAS.add(uf);
    }
    cartRenderFiltroUfsRede();
    cartBuscarCarteiraRede();
  }

  // Renderiza as pills de UF acima do conteúdo — só aparece no modo "rede"
  // e quando existe mais de uma UF disponível pra filtrar.
  function cartRenderFiltroUfsRede() {
    const wrap = document.getElementById('cartFiltroUfsRede');
    if (!CART_REDE_ATUAL || CART_REDE_UFS_TODAS.length === 0) {
      wrap.style.display = 'none';
      wrap.innerHTML = '';
      return;
    }

    const pillsHtml = CART_REDE_UFS_TODAS.map(uf => {
      const ativa = CART_REDE_UFS_ATIVAS.has(uf);
      return `<button type="button" class="cart-uf-pill ${ativa ? 'cart-uf-pill-ativa' : ''}" onclick="cartToggleUfRede('${uf.replace(/'/g, "\\'")}')">${ativa ? '✓ ' : ''}${uf}</button>`;
    }).join('');

    wrap.style.display = 'block';
    wrap.innerHTML = `
      <div class="cart-panel">
        <div class="cart-panel-title">Filtrar por UF (${CART_REDE_UFS_ATIVAS.size} de ${CART_REDE_UFS_TODAS.length} selecionada${CART_REDE_UFS_ATIVAS.size !== 1 ? 's' : ''})</div>
        <div class="cart-uf-pills">${pillsHtml}</div>
      </div>`;
  }

  // Busca a carteira da rede atual, restringindo às UFs marcadas nas pills
  // (quando há mais de uma UF disponível). Se nenhuma UF estiver marcada,
  // nem chama a API — mostra direto o estado vazio.
  function cartBuscarCarteiraRede() {
    const nome = CART_REDE_ATUAL;
    if (!nome) return;

    if (CART_REDE_UFS_TODAS.length > 0 && CART_REDE_UFS_ATIVAS.size === 0) {
      CART_DADOS = null;
      document.getElementById('cartConteudo').innerHTML =
        '<div class="cart-panel"><div class="cart-empty"><div class="disp">Nenhuma UF selecionada</div><div>Marque ao menos uma UF acima pra ver a carteira da rede.</div></div></div>';
      document.getElementById('cartResumoTopo').style.display = 'none';
      return;
    }

    document.getElementById('cartConteudo').innerHTML =
      '<div class="cart-panel"><div class="cart-loading">Calculando carteira da rede ' + nome + '...</div></div>';

    const params = { uf: UF_USUARIO, rede: nome };
    if (CART_REDE_UFS_TODAS.length > 0) {
      params.ufs = Array.from(CART_REDE_UFS_ATIVAS);
    }

    chamarApi('carteiraRede', params)
      .then(resp => {
        if (!resp || resp.erro) {
          document.getElementById('cartConteudo').innerHTML =
            '<div class="cart-panel"><div class="cart-empty"><div class="disp">Não foi possível carregar</div><div>' +
            (resp && resp.mensagem ? resp.mensagem : 'Tente novamente em instantes.') + '</div></div></div>';
          return;
        }
        CART_DADOS = resp;
        document.getElementById('cartResumoTopo').style.display = 'block';
        document.getElementById('cartTopoVendedor').innerText = 'Rede: ' + resp.rede;
        document.getElementById('cartTopoTotalClientes').innerText = resp.totalClientesCarteira + ' cliente' + (resp.totalClientesCarteira !== 1 ? 's' : '') + ' na rede';
        cartRenderConteudo();
      })
      .catch(() => {
        document.getElementById('cartConteudo').innerHTML =
          '<div class="cart-panel"><div class="cart-empty"><div class="disp">Erro de conexão</div><div>Não foi possível buscar os dados. Tente novamente.</div></div></div>';
      });
  }

  function cartRenderConteudo() {
    if (CART_CLIENTE_ATUAL) {
      cartRenderClienteDireto();
      return;
    }
    if ((!CART_VENDEDOR_ATUAL && !CART_REDE_ATUAL) || !CART_DADOS) {
      document.getElementById('cartConteudo').innerHTML =
        '<div class="cart-panel"><div class="cart-empty"><div class="disp">Nenhum filtro selecionado</div><div>Busque um cliente diretamente, ou escolha um vendedor acima para ver o resumo da carteira por fornecedor.</div></div></div>';
      return;
    }
    if (CART_FORNECEDOR_ATUAL) {
      cartRenderDetalheFornecedor();
    } else {
      cartRenderResumo();
    }
  }

  // ── MODO "CLIENTE DIRETO" — resumo de faturamento de um único cliente ──
  function cartRenderClienteDireto() {
    const wrap = document.getElementById('cartConteudo');
    const resp = CART_CLIENTE_RESUMO;
    const cliente = CART_CLIENTE_ATUAL;

    if (!resp) return; // ainda carregando (o loading já foi colocado em cartSelecionarClienteTopo)

    if (resp.erro) {
      wrap.innerHTML = '<div class="cart-panel"><div class="cart-empty"><div class="disp">Não foi possível carregar</div><div>' +
        (resp.mensagem || 'Tente novamente em instantes.') + '</div></div></div>';
      return;
    }

    const headerHtml = `
      <div class="cart-detail-header" style="margin-bottom:0;">
        <div class="cart-detail-title-wrap">
          <button type="button" class="cart-btn" onclick="cartLimparClienteTopo()">
            <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
            Limpar
          </button>
          <span class="disp" style="font-size:15px; font-weight:700;">${(cliente.razao || '').toUpperCase()}</span>
        </div>
      </div>`;

    const fornecedores = resp.fornecedores || [];
    if (fornecedores.length === 0) {
      wrap.innerHTML = `<div class="cart-panel">${headerHtml}<div class="cart-empty" style="margin-top:14px;"><div class="disp">Sem movimentação</div><div>Nenhum faturamento encontrado para este cliente.</div></div></div>`;
      return;
    }

    const cardsHtml = fornecedores.map(f => {
      const cfg = cartGetConfigFornecedor(f.fornecedor);
      const logoHtml = cfg.logo
        ? `<img src="${cfg.logo}" alt="${f.fornecedor}" onerror="this.parentElement.innerHTML='<span style=\\'font-weight:800;font-size:11px;color:${cfg.cor2}\\'>${f.fornecedor}</span>'">`
        : `<span style="font-weight:800; font-size:11px; color:${cfg.cor2}">${f.fornecedor}</span>`;

      return `
        <div class="cart-card">
          <div class="cart-card-header" style="background: linear-gradient(135deg, ${cfg.cor1} 0%, ${cfg.cor2} 100%);">
            <span class="cart-card-header-nome">${f.fornecedor}</span>
            <div class="cart-card-header-logo">${logoHtml}</div>
          </div>
          <div class="cart-card-body">
            <div class="cart-metric-row">
              <span class="cart-metric-label">Fat. Ano Anterior</span>
              <span class="cart-metric-value mono">${cartFormatBRL(f.faturadoAnoAnterior)}</span>
            </div>
            <div class="cart-metric-row">
              <span class="cart-metric-label">Média Mensal (3 meses ant.)</span>
              <span class="cart-metric-value mono">${cartFormatBRL(cartMediaMensal(f.faturadoTri))}</span>
            </div>
            <div class="cart-metric-row">
              <span class="cart-metric-label">Fat. Mês Atual</span>
              <span class="cart-metric-value mono" style="color:var(--accent)">${cartFormatBRL(f.faturadoMesAtual)}</span>
            </div>
            <div class="cart-metric-row">
              <span class="cart-metric-label">Variação YoY</span>
              ${cartBadgeVariacaoHtml(f.faturadoAnoAnterior, f.faturadoMesAtual)}
            </div>
            <div style="margin-top:2px;">
              ${f.positivado
                ? '<span class="cart-badge cart-badge-ok">✓ Positivado</span>'
                : '<span class="cart-badge cart-badge-nao">— Não comprou no mês</span>'}
            </div>
          </div>
        </div>`;
    }).join('');

    wrap.innerHTML = `
      <div class="cart-panel" style="margin-bottom:14px;">${headerHtml}</div>
      <div class="cart-grid">${cardsHtml}</div>`;
  }


  // ── NÍVEL 1 — RESUMO POR FORNECEDOR ──────────────────────────────────
  function cartRenderResumo() {
    const wrap = document.getElementById('cartConteudo');
    const fornecedores = CART_DADOS.fornecedores || [];

    if (fornecedores.length === 0) {
      wrap.innerHTML = '<div class="cart-panel"><div class="cart-empty"><div class="disp">Sem movimentação</div><div>Nenhum faturamento encontrado para os clientes desta carteira.</div></div></div>';
      return;
    }

    const cardsHtml = fornecedores.map(f => {
      const cfg = cartGetConfigFornecedor(f.fornecedor);
      const logoHtml = cfg.logo
        ? `<img src="${cfg.logo}" alt="${f.fornecedor}" onerror="this.parentElement.innerHTML='<span style=\\'font-weight:800;font-size:11px;color:${cfg.cor2}\\'>${f.fornecedor}</span>'">`
        : `<span style="font-weight:800; font-size:11px; color:${cfg.cor2}">${f.fornecedor}</span>`;

      const pct = f.percentualPositivacao || 0;
      const corBarra = pct >= 70 ? 'var(--success)' : pct >= 40 ? '#f59e0b' : 'var(--danger)';

      return `
        <div class="cart-card">
          <div class="cart-card-header" style="background: linear-gradient(135deg, ${cfg.cor1} 0%, ${cfg.cor2} 100%);">
            <span class="cart-card-header-nome">${f.fornecedor}</span>
            <div class="cart-card-header-logo">${logoHtml}</div>
          </div>
          <div class="cart-card-body">
            <div class="cart-metric-row">
              <span class="cart-metric-label">Fat. Ano Anterior</span>
              <span class="cart-metric-value mono">${cartFormatBRL(f.faturadoAnoAnterior)}</span>
            </div>
            <div class="cart-metric-row">
              <span class="cart-metric-label">Média Mensal (3 meses ant.)</span>
              <span class="cart-metric-value mono">${cartFormatBRL(cartMediaMensal(f.faturadoTri))}</span>
            </div>
            <div class="cart-metric-row">
              <span class="cart-metric-label">Fat. Mês Atual</span>
              <span class="cart-metric-value mono" style="color:var(--accent)">${cartFormatBRL(f.faturadoMesAtual)}</span>
            </div>
            <div class="cart-metric-row">
              <span class="cart-metric-label">Variação YoY</span>
              ${cartBadgeVariacaoHtml(f.faturadoAnoAnterior, f.faturadoMesAtual)}
            </div>
            <div class="cart-progress-wrap">
              <div class="cart-progress-track">
                <div class="cart-progress-fill" style="width:${pct}%; background:${corBarra};"></div>
              </div>
              <div class="cart-progress-label">
                <span>${f.clientesPositivados} de ${f.totalClientesCarteira} positivados</span>
                <span style="font-weight:800; color:${corBarra};">${pct.toFixed(1)}%</span>
              </div>
            </div>
          </div>
          <div class="cart-card-footer">
            <button type="button" class="cart-btn cart-btn-gold" onclick="cartVerDetalheFornecedor('${f.fornecedor.replace(/'/g, "\\'")}')">
              Ver carteira de clientes →
            </button>
          </div>
        </div>`;
    }).join('');

    wrap.innerHTML = `<div class="cart-grid">${cardsHtml}</div>`;
  }

  // ── NÍVEL 2 — CARTEIRA DE CLIENTES DE UM FORNECEDOR ──────────────────
  function cartVerDetalheFornecedor(fornecedor) {
    CART_FORNECEDOR_ATUAL = fornecedor;
    cartRenderConteudo();
  }

  function cartVoltarResumo() {
    CART_FORNECEDOR_ATUAL = null;
    cartRenderConteudo();
  }

  function cartRenderDetalheFornecedor() {
    const wrap = document.getElementById('cartConteudo');
    const fornecedor = CART_FORNECEDOR_ATUAL;
    const clientes = (CART_DADOS.clientesPorFornecedor && CART_DADOS.clientesPorFornecedor[fornecedor]) || [];
    const cfg = cartGetConfigFornecedor(fornecedor);
    const logoHtml = cfg.logo
      ? `<img src="${cfg.logo}" alt="${fornecedor}" onerror="this.parentElement.innerHTML='<span style=\\'font-weight:800;font-size:12px;color:${cfg.cor2}\\'>${fornecedor}</span>'">`
      : `<span style="font-weight:800; font-size:12px; color:${cfg.cor2}">${fornecedor}</span>`;

    wrap.innerHTML = `
      <div class="cart-panel">
        <div class="cart-detail-header">
          <div class="cart-detail-title-wrap">
            <button type="button" class="cart-btn" onclick="cartVoltarResumo()">
              <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
              Voltar ao resumo
            </button>
            <div class="cart-detail-logo" style="background: linear-gradient(135deg, ${cfg.cor1} 0%, ${cfg.cor2} 100%);">${logoHtml}</div>
            <span class="disp" style="font-size:15px; font-weight:700;">Carteira — ${fornecedor}</span>
          </div>
          <input id="cartBuscaClienteDetalhe" class="cart-input" placeholder="Buscar cliente ou CNPJ..." oninput="cartFiltrarTabelaDetalhe()">
        </div>
        <div id="cartTabelaDetalheWrap"></div>
      </div>`;

    cartRenderizarTabelaClientes(clientes);
  }

  function cartFiltrarTabelaDetalhe() {
    const termo = (document.getElementById('cartBuscaClienteDetalhe').value || '').toLowerCase().trim();
    const todos = (CART_DADOS.clientesPorFornecedor && CART_DADOS.clientesPorFornecedor[CART_FORNECEDOR_ATUAL]) || [];
    if (!termo) { cartRenderizarTabelaClientes(todos); return; }
    const filtrados = todos.filter(c =>
      String(c.razao).toLowerCase().includes(termo) ||
      String(c.cnpj).replace(/\D/g, '').includes(termo) ||
      String(c.codCliente).toLowerCase().includes(termo)
    );
    cartRenderizarTabelaClientes(filtrados);
  }

  function cartRenderizarTabelaClientes(clientes) {
    const wrap = document.getElementById('cartTabelaDetalheWrap');
    if (!clientes || clientes.length === 0) {
      wrap.innerHTML = '<div class="cart-empty"><div class="disp">Nenhum cliente encontrado</div><div>Ajuste a busca ou volte ao resumo.</div></div>';
      return;
    }

    const linhas = clientes.map(c => `
      <tr>
        <td>
          <div style="font-weight:700;">${(c.razao || '').toUpperCase()}</div>
          <div class="mono" style="font-size:10.5px; color:var(--text-secondary);">${c.cnpj || '—'}</div>
        </td>
        <td class="cart-num mono">${cartFormatBRL(c.faturadoAnoAnterior)}</td>
        <td class="cart-num mono">${cartFormatBRL(cartMediaMensal(c.faturadoTri))}</td>
        <td class="cart-num mono" style="font-weight:700; color:var(--accent);">${cartFormatBRL(c.faturadoMesAtual)}</td>
        <td class="cart-num">${cartBadgeVariacaoHtml(c.faturadoAnoAnterior, c.faturadoMesAtual)}</td>
        <td class="cart-num">
          ${c.positivado
            ? '<span class="cart-badge cart-badge-ok">✓ Positivado</span>'
            : '<span class="cart-badge cart-badge-nao">— Não comprou</span>'}
        </td>
      </tr>`).join('');

    wrap.innerHTML = `
      <div class="cart-table-scroll">
        <table class="cart-table">
          <thead>
            <tr>
              <th>Cliente</th>
              <th class="cart-num">Fat. Ano Anterior</th>
              <th class="cart-num">Média Mensal</th>
              <th class="cart-num">Fat. Mês Atual</th>
              <th class="cart-num">Var. YoY</th>
              <th class="cart-num">Status</th>
            </tr>
          </thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>`;
  }

  // ── INIT ──────────────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    cartCarregarVendedores();
    cartCarregarRedes();
    cartCarregarClientesBusca();
    cartRenderConteudo();
  });
</script>
</body>
</html>
